<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="GoalApp - Portada del proyecto">
  <title>GoalApp - Portada</title>
  <desc>Portada representativa del proyecto GoalApp con branding y captura de la landing.</desc>

  <defs>
    <linearGradient id="bgCoverGoal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1F1A"/>
      <stop offset="1" stop-color="#030706"/>
    </linearGradient>

    <linearGradient id="logoCoverGoal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#00770D"/>
    </linearGradient>

    <radialGradient id="logoGlowGoal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gridPatternGoal" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.05"/>
    </pattern>

    <!-- Mini landing page -->
    <symbol id="miniLanding" viewBox="0 0 600 380">
      <rect width="600" height="380" fill="#18181B"/>
      <!-- Browser chrome -->
      <rect x="0" y="0" width="600" height="32" fill="#27272A"/>
      <circle cx="20" cy="16" r="5" fill="#EF4444"/>
      <circle cx="38" cy="16" r="5" fill="#FBBF24"/>
      <circle cx="56" cy="16" r="5" fill="#22C55E"/>
      <!-- Header -->
      <rect x="0" y="32" width="600" height="36" fill="#18181B"/>
      <circle cx="30" cy="50" r="10" fill="#BEF264"/>
      <text x="50" y="55" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="13" font-weight="700">GoalApp</text>
      <rect x="510" y="42" width="60" height="20" rx="4" fill="#BEF264"/>
      <text x="540" y="56" text-anchor="middle" fill="#18181B" font-family="Roboto, sans-serif" font-size="10" font-weight="700">Login</text>
      <!-- Hero -->
      <rect x="0" y="68" width="600" height="200" fill="url(#bgCoverGoal)"/>
      <rect x="180" y="100" width="240" height="22" rx="11" fill="#27272A" stroke="#BEF264" stroke-width="0.5"/>
      <text x="220" y="115" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="9">⚡ La mejor plataforma deportiva</text>
      <text x="300" y="160" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="22" font-weight="800">Gestiona tu Liga</text>
      <text x="300" y="186" text-anchor="middle" fill="#BEF264" font-family="Roboto, sans-serif" font-size="22" font-weight="800">de forma Profesional</text>
      <rect x="240" y="218" width="120" height="28" rx="8" fill="#BEF264"/>
      <text x="300" y="237" text-anchor="middle" fill="#18181B" font-family="Roboto, sans-serif" font-size="10" font-weight="700">Comenzar Ahora →</text>
      <!-- Features -->
      <g transform="translate(40 285)">
        <rect x="0" y="0" width="125" height="60" rx="6" fill="#27272A"/>
        <rect x="50" y="8" width="26" height="26" rx="4" fill="#BEF264"/>
        <text x="62.5" y="48" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="9" font-weight="600">Ligas</text>
      </g>
      <g transform="translate(180 285)">
        <rect x="0" y="0" width="125" height="60" rx="6" fill="#27272A"/>
        <rect x="50" y="8" width="26" height="26" rx="4" fill="#BEF264"/>
        <text x="62.5" y="48" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="9" font-weight="600">Equipos</text>
      </g>
      <g transform="translate(320 285)">
        <rect x="0" y="0" width="125" height="60" rx="6" fill="#27272A"/>
        <rect x="50" y="8" width="26" height="26" rx="4" fill="#BEF264"/>
        <text x="62.5" y="48" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="9" font-weight="600">Calendario</text>
      </g>
      <g transform="translate(460 285)">
        <rect x="0" y="0" width="125" height="60" rx="6" fill="#27272A"/>
        <rect x="50" y="8" width="26" height="26" rx="4" fill="#BEF264"/>
        <text x="62.5" y="48" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="9" font-weight="600">Rankings</text>
      </g>
    </symbol>

    <!-- Mini dashboard -->
    <symbol id="miniDashboard" viewBox="0 0 600 380">
      <rect width="600" height="380" fill="#18181B"/>
      <rect x="0" y="0" width="600" height="32" fill="#27272A"/>
      <circle cx="20" cy="16" r="5" fill="#EF4444"/>
      <circle cx="38" cy="16" r="5" fill="#FBBF24"/>
      <circle cx="56" cy="16" r="5" fill="#22C55E"/>
      <!-- Nav -->
      <rect x="0" y="32" width="600" height="28" fill="#18181B" stroke="#27272A"/>
      <text x="20" y="50" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="11" font-weight="600">GoalApp</text>
      <!-- Stats row -->
      <g transform="translate(20 75)">
        <rect x="0" y="0" width="135" height="50" rx="6" fill="#27272A"/>
        <text x="10" y="18" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="8" letter-spacing="1">EQUIPOS</text>
        <text x="10" y="40" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="20" font-weight="700">8</text>
      </g>
      <g transform="translate(165 75)">
        <rect x="0" y="0" width="135" height="50" rx="6" fill="#27272A"/>
        <text x="10" y="18" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="8" letter-spacing="1">JUGADORES</text>
        <text x="10" y="40" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="20" font-weight="700">142</text>
      </g>
      <g transform="translate(310 75)">
        <rect x="0" y="0" width="135" height="50" rx="6" fill="#27272A"/>
        <text x="10" y="18" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="8" letter-spacing="1">PARTIDOS</text>
        <text x="10" y="40" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="20" font-weight="700">56</text>
      </g>
      <g transform="translate(455 75)">
        <rect x="0" y="0" width="125" height="50" rx="6" fill="#27272A"/>
        <text x="10" y="18" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="8" letter-spacing="1">EN VIVO</text>
        <text x="10" y="40" fill="#EF4444" font-family="Roboto, sans-serif" font-size="20" font-weight="700">2</text>
        <circle cx="58" cy="34" r="3" fill="#EF4444"/>
      </g>
      <!-- Clasificación -->
      <g transform="translate(20 145)">
        <rect x="0" y="0" width="340" height="220" rx="6" fill="#27272A"/>
        <text x="14" y="22" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="11" font-weight="600">Clasificación</text>
        <g transform="translate(14 35)">
          <rect x="0" y="0" width="312" height="22" fill="#3F3F46"/>
          <text x="14" y="16" text-anchor="middle" fill="#BEF264" font-family="Roboto, sans-serif" font-size="10" font-weight="700">1</text>
          <circle cx="28" cy="11" r="5" fill="#BEF264"/>
          <text x="40" y="15" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="10" font-weight="500">Atlético Madrid</text>
          <text x="240" y="15" text-anchor="middle" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="10">10</text>
          <text x="290" y="15" text-anchor="end" fill="#BEF264" font-family="Roboto, sans-serif" font-size="10" font-weight="700">25</text>
        </g>
        <g transform="translate(14 60)">
          <text x="14" y="16" text-anchor="middle" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="10">2</text>
          <circle cx="28" cy="11" r="5" fill="#FFFFFF"/>
          <text x="40" y="15" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="10">Real Madrid</text>
          <text x="240" y="15" text-anchor="middle" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="10">10</text>
          <text x="290" y="15" text-anchor="end" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="10" font-weight="700">22</text>
        </g>
        <g transform="translate(14 85)">
          <text x="14" y="16" text-anchor="middle" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="10">3</text>
          <circle cx="28" cy="11" r="5" fill="#A21CAF"/>
          <text x="40" y="15" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="10">FC Barcelona</text>
          <text x="240" y="15" text-anchor="middle" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="10">10</text>
          <text x="290" y="15" text-anchor="end" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="10" font-weight="700">20</text>
        </g>
        <g transform="translate(14 110)">
          <text x="14" y="16" text-anchor="middle" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="10">4</text>
          <circle cx="28" cy="11" r="5" fill="#EF4444"/>
          <text x="40" y="15" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="10">Sevilla FC</text>
          <text x="240" y="15" text-anchor="middle" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="10">10</text>
          <text x="290" y="15" text-anchor="end" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="10" font-weight="700">17</text>
        </g>
        <g transform="translate(14 135)">
          <text x="14" y="16" text-anchor="middle" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="10">5</text>
          <circle cx="28" cy="11" r="5" fill="#22C55E"/>
          <text x="40" y="15" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="10">Sporting Gijón</text>
          <text x="240" y="15" text-anchor="middle" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="10">10</text>
          <text x="290" y="15" text-anchor="end" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="10" font-weight="700">15</text>
        </g>
      </g>
      <!-- Próximos -->
      <g transform="translate(375 145)">
        <rect x="0" y="0" width="205" height="220" rx="6" fill="#27272A"/>
        <text x="14" y="22" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="11" font-weight="600">Próximos</text>
        <g transform="translate(14 40)">
          <rect x="0" y="0" width="177" height="48" rx="4" fill="#3F3F46"/>
          <circle cx="14" cy="18" r="6" fill="#A21CAF"/>
          <text x="26" y="22" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="9">FC Barcelona</text>
          <text x="170" y="14" text-anchor="end" fill="#BEF264" font-family="Roboto, sans-serif" font-size="8" font-weight="600">12 MAY</text>
          <circle cx="14" cy="38" r="6" fill="#FFFFFF"/>
          <text x="26" y="42" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="9">Real Madrid</text>
        </g>
        <g transform="translate(14 100)">
          <rect x="0" y="0" width="177" height="48" rx="4" fill="#3F3F46"/>
          <circle cx="14" cy="18" r="6" fill="#EF4444"/>
          <text x="26" y="22" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="9">Sevilla FC</text>
          <text x="170" y="14" text-anchor="end" fill="#BEF264" font-family="Roboto, sans-serif" font-size="8" font-weight="600">14 MAY</text>
          <circle cx="14" cy="38" r="6" fill="#BEF264"/>
          <text x="26" y="42" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="9">Atlético</text>
        </g>
      </g>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgCoverGoal)"/>
  <rect width="1200" height="630" fill="url(#gridPatternGoal)"/>

  <!-- Glow ambient -->
  <circle cx="280" cy="315" r="280" fill="url(#logoGlowGoal)"/>

  <!-- Branding izquierdo -->
  <g transform="translate(60 100)">
    <!-- Tag -->
    <g>
      <rect x="0" y="0" width="200" height="32" rx="16" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5"/>
      <circle cx="22" cy="16" r="4" fill="#10B981"/>
      <text x="38" y="21" fill="#10B981" font-family="monospace,monospace" font-size="11" font-weight="600" letter-spacing="2">FULL-STACK · DEPLOYED</text>
    </g>

    <!-- Título -->
    <text x="0" y="100" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">GoalApp</text>

    <!-- Subtítulo -->
    <text x="0" y="148" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="18" font-weight="400">Gestión de ligas amateur · React + FastAPI</text>

    <!-- Descripción -->
    <text x="0" y="210" fill="#888A8D" font-family="Roboto, sans-serif" font-size="15" font-weight="400">Partidos en vivo, clasificación, estadísticas</text>
    <text x="0" y="232" fill="#888A8D" font-family="Roboto, sans-serif" font-size="15" font-weight="400">y roles por equipo en tiempo real.</text>

    <!-- Tech badges -->
    <g transform="translate(0 280)">
      <g>
        <rect x="0" y="0" width="58" height="32" rx="8" fill="#1A1C1E" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
        <text x="29" y="21" text-anchor="middle" fill="#5CE55A" font-family="monospace,monospace" font-size="12" font-weight="500">React</text>
      </g>
      <g transform="translate(68 0)">
        <rect x="0" y="0" width="78" height="32" rx="8" fill="#1A1C1E" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
        <text x="39" y="21" text-anchor="middle" fill="#5CE55A" font-family="monospace,monospace" font-size="12" font-weight="500">FastAPI</text>
      </g>
      <g transform="translate(156 0)">
        <rect x="0" y="0" width="96" height="32" rx="8" fill="#1A1C1E" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
        <text x="48" y="21" text-anchor="middle" fill="#5CE55A" font-family="monospace,monospace" font-size="12" font-weight="500">Supabase</text>
      </g>
    </g>

    <!-- Año -->
    <text x="0" y="380" fill="#464749" font-family="monospace,monospace" font-size="14" font-weight="500" letter-spacing="2">2026 · MVP · INSTITUTO</text>
  </g>

  <!-- Showcase derecho: 2 mini screenshots apilados -->
  <g transform="translate(660 50)">
    <!-- Landing (atrás, ligeramente rotada) -->
    <g transform="translate(40 30) rotate(4 250 175)">
      <rect x="0" y="0" width="500" height="320" rx="10" fill="#18181B" stroke="#10B981" stroke-width="1" stroke-opacity="0.2" opacity="0.88"/>
      <use href="#miniLanding" width="500" height="320" rx="10"/>
    </g>

    <!-- Dashboard (delante) -->
    <g transform="translate(0 110)">
      <rect x="0" y="0" width="500" height="320" rx="10" fill="#18181B" stroke="#10B981" stroke-width="2" stroke-opacity="0.5"/>
      <use href="#miniDashboard" width="500" height="320" rx="10"/>
      <!-- Sombra interior -->
      <rect x="2" y="2" width="496" height="316" rx="8" fill="none" stroke="#000" stroke-width="1" stroke-opacity="0.3"/>
    </g>

    <!-- Etiqueta "MOCKUPS" -->
    <text x="250" y="510" text-anchor="middle" fill="#464749" font-family="monospace,monospace" font-size="9" font-weight="600" letter-spacing="3">REPRESENTATIVE MOCKUPS · NOT REAL CAPTURES</text>
  </g>

  <!-- Corner brackets -->
  <g stroke="#10B981" stroke-width="2" fill="none" stroke-opacity="0.6">
    <path d="M30 30 L30 60 M30 30 L60 30"/>
    <path d="M1170 30 L1170 60 M1170 30 L1140 30"/>
    <path d="M30 600 L30 570 M30 600 L60 600"/>
    <path d="M1170 600 L1170 570 M1170 600 L1140 600"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Project_Log - Grid de proyectos">
  <title>Project_Log - Gestión de proyectos</title>
  <desc>Mockup del panel multi-proyecto con tarjetas que muestran contadores de logs, entorno y API key enmascarada.</desc>

  <defs>
    <linearGradient id="bgPLProjects" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071310"/>
      <stop offset="1" stop-color="#030706"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgPLProjects)"/>

  <!-- Ventana terminal -->
  <rect x="20" y="20" width="1160" height="660" rx="12" fill="#0B1512" stroke="#10B981" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Barra de título -->
  <rect x="20" y="20" width="1160" height="52" rx="12" fill="#101F1A"/>
  <rect x="20" y="58" width="1160" height="14" fill="#101F1A"/>
  <circle cx="55" cy="46" r="7" fill="#EF4444"/>
  <circle cx="80" cy="46" r="7" fill="#FBBF24"/>
  <circle cx="105" cy="46" r="7" fill="#22C55E"/>
  <rect x="440" y="32" width="320" height="28" rx="14" fill="#08100D" stroke="#10B981" stroke-opacity="0.2"/>
  <text x="600" y="51" text-anchor="middle" fill="#6B8578" font-family="monospace,monospace" font-size="12">localhost:8080/proyectos</text>

  <!-- Cabecera -->
  <g transform="translate(20 72)" font-family="monospace,monospace">
    <rect x="0" y="0" width="1160" height="56" fill="#08100D"/>
    <line x1="0" y1="56" x2="1160" y2="56" stroke="#10B981" stroke-opacity="0.15" stroke-width="1"/>
    <text x="24" y="36" fill="#E8F5EE" font-size="17" font-weight="700">Proyectos</text>
    <text x="140" y="35" fill="#4E6157" font-size="11">4 activos &#183; 1 archivado</text>
    <rect x="990" y="14" width="146" height="28" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.5" stroke-width="1"/>
    <text x="1063" y="33" text-anchor="middle" fill="#5CE55A" font-size="12" font-weight="600">+ Nuevo proyecto</text>
  </g>

  <!-- Card 1: portfolio -->
  <g transform="translate(50 160)">
    <rect x="0" y="0" width="540" height="200" rx="10" fill="#0B1512" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="0" y="0" width="540" height="4" rx="2" fill="#10B981"/>
    <text x="24" y="42" fill="#E8F5EE" font-family="monospace,monospace" font-size="16" font-weight="700">portfolio</text>
    <rect x="440" y="26" width="76" height="20" rx="10" fill="#22C55E" fill-opacity="0.12"/>
    <text x="478" y="40" text-anchor="middle" fill="#22C55E" font-family="monospace,monospace" font-size="10">activo</text>
    <text x="24" y="64" fill="#4E6157" font-family="monospace,monospace" font-size="10" letter-spacing="2">ENTORNO</text>
    <text x="24" y="82" fill="#C8DBC7" font-family="monospace,monospace" font-size="12">producci&#243;n</text>
    <text x="292" y="64" fill="#4E6157" font-family="monospace,monospace" font-size="10" letter-spacing="2">LOGS</text>
    <text x="292" y="86" fill="#5CE55A" font-family="monospace,monospace" font-size="22" font-weight="800">1.412</text>
    <rect x="24" y="106" width="492" height="1" fill="#10B981" fill-opacity="0.15"/>
    <text x="24" y="130" fill="#4E6157" font-family="monospace,monospace" font-size="10" letter-spacing="2">API KEY</text>
    <text x="24" y="148" fill="#6B8578" font-family="monospace,monospace" font-size="11">plk_9f&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226; (SHA-256)</text>
    <text x="516" y="186" text-anchor="end" fill="#5CE55A" font-family="monospace,monospace" font-size="11">Ver logs &#183; Regenerar &#183; Archivar</text>
  </g>

  <!-- Card 2: goalapp -->
  <g transform="translate(610 160)">
    <rect x="0" y="0" width="540" height="200" rx="10" fill="#0B1512" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="0" y="0" width="540" height="4" rx="2" fill="#10B981"/>
    <text x="24" y="42" fill="#E8F5EE" font-family="monospace,monospace" font-size="16" font-weight="700">goalapp</text>
    <rect x="440" y="26" width="76" height="20" rx="10" fill="#22C55E" fill-opacity="0.12"/>
    <text x="478" y="40" text-anchor="middle" fill="#22C55E" font-family="monospace,monospace" font-size="10">activo</text>
    <text x="24" y="64" fill="#4E6157" font-family="monospace,monospace" font-size="10" letter-spacing="2">ENTORNO</text>
    <text x="24" y="82" fill="#C8DBC7" font-family="monospace,monospace" font-size="12">producci&#243;n &#183; Render</text>
    <text x="292" y="64" fill="#4E6157" font-family="monospace,monospace" font-size="10" letter-spacing="2">LOGS</text>
    <text x="292" y="86" fill="#5CE55A" font-family="monospace,monospace" font-size="22" font-weight="800">876</text>
    <rect x="24" y="106" width="492" height="1" fill="#10B981" fill-opacity="0.15"/>
    <text x="24" y="130" fill="#4E6157" font-family="monospace,monospace" font-size="10" letter-spacing="2">API KEY</text>
    <text x="24" y="148" fill="#6B8578" font-family="monospace,monospace" font-size="11">plk_4a&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226; (SHA-256)</text>
    <text x="516" y="186" text-anchor="end" fill="#5CE55A" font-family="monospace,monospace" font-size="11">Ver logs &#183; Regenerar &#183; Archivar</text>
  </g>

  <!-- Card 3: payment-service (con alerta de ERROR) -->
  <g transform="translate(50 384)">
    <rect x="0" y="0" width="540" height="200" rx="10" fill="#0B1512" stroke="#EF4444" stroke-opacity="0.35" stroke-width="1"/>
    <rect x="0" y="0" width="540" height="4" rx="2" fill="#EF4444"/>
    <text x="24" y="42" fill="#E8F5EE" font-family="monospace,monospace" font-size="16" font-weight="700">payment-service</text>
    <rect x="440" y="26" width="76" height="20" rx="10" fill="#22C55E" fill-opacity="0.12"/>
    <text x="478" y="40" text-anchor="middle" fill="#22C55E" font-family="monospace,monospace" font-size="10">activo</text>
    <text x="24" y="64" fill="#4E6157" font-family="monospace,monospace" font-size="10" letter-spacing="2">ENTORNO</text>
    <text x="24" y="82" fill="#C8DBC7" font-family="monospace,monospace" font-size="12">producci&#243;n &#183; CT 106</text>
    <text x="292" y="64" fill="#4E6157" font-family="monospace,monospace" font-size="10" letter-spacing="2">LOGS</text>
    <text x="292" y="86" fill="#5CE55A" font-family="monospace,monospace" font-size="22" font-weight="800">3.208</text>
    <g font-family="monospace,monospace" font-size="10">
      <rect x="292" y="102" width="86" height="18" rx="4" fill="#EF4444" fill-opacity="0.15"/>
      <text x="300" y="115" fill="#EF4444">ERROR: 12</text>
      <rect x="386" y="102" width="72" height="18" rx="4" fill="#FBBF24" fill-opacity="0.12"/>
      <text x="394" y="115" fill="#FBBF24">WARN: 31</text>
    </g>
    <rect x="24" y="106" width="252" height="1" fill="#10B981" fill-opacity="0.15"/>
    <text x="516" y="186" text-anchor="end" fill="#5CE55A" font-family="monospace,monospace" font-size="11">Ver logs &#183; Regenerar &#183; Archivar</text>
  </g>

  <!-- Card 4: legacy-api archivado -->
  <g transform="translate(610 384)" opacity="0.7">
    <rect x="0" y="0" width="540" height="200" rx="10" fill="#08100D" stroke="#4E6157" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="0" y="0" width="540" height="4" rx="2" fill="#4E6157"/>
    <text x="24" y="42" fill="#8FA79B" font-family="monospace,monospace" font-size="16" font-weight="700">legacy-api</text>
    <rect x="428" y="26" width="88" height="20" rx="10" fill="#4E6157" fill-opacity="0.18"/>
    <text x="472" y="40" text-anchor="middle" fill="#8FA79B" font-family="monospace,monospace" font-size="10">archivado</text>
    <text x="24" y="64" fill="#4E6157" font-family="monospace,monospace" font-size="10" letter-spacing="2">ENTORNO</text>
    <text x="24" y="82" fill="#6B8578" font-family="monospace,monospace" font-size="12">staging &#183; retirado</text>
    <text x="292" y="64" fill="#4E6157" font-family="monospace,monospace" font-size="10" letter-spacing="2">LOGS</text>
    <text x="292" y="86" fill="#8FA79B" font-family="monospace,monospace" font-size="22" font-weight="800">210</text>
    <rect x="24" y="106" width="492" height="1" fill="#4E6157" fill-opacity="0.2"/>
    <text x="24" y="130" fill="#4E6157" font-family="monospace,monospace" font-size="10" letter-spacing="2">API KEY</text>
    <text x="24" y="148" fill="#3C4A44" font-family="monospace,monospace" font-size="11">&#8226;&#8226;&#8226; revocada al archivar &#8226;&#8226;&#8226;</text>
    <text x="516" y="186" text-anchor="end" fill="#6B8578" font-family="monospace,monospace" font-size="11">Restaurar &#183; Eliminar</text>
  </g>

  <!-- Nota pie -->
  <g transform="translate(50 614)" font-family="monospace,monospace">
    <rect x="0" y="0" width="1100" height="38" rx="6" fill="#10B981" fill-opacity="0.06" stroke="#10B981" stroke-opacity="0.25" stroke-width="1"/>
    <text x="20" y="24" fill="#8FA79B" font-size="11">La API key solo se revela una vez al crear o regenerar; despu&#233;s se guarda como hash SHA-256.</text>
  </g>

  <!-- Pie -->
  <text x="600" y="730" text-anchor="middle" fill="#4E6157" font-family="monospace,monospace" font-size="10" letter-spacing="3">MOCKUP · PROJECT_LOG GESTIÓN DE PROYECTOS</text>
</svg>

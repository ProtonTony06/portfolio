<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="GoalApp - Partido en vivo">
  <title>GoalApp - Live</title>
  <desc>Mockup de la página de partidos en vivo con marcador y eventos en tiempo real.</desc>

  <defs>
    <linearGradient id="bgGoalLive" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18181B"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="#09090B"/>

  <!-- Browser chrome -->
  <g>
    <rect x="20" y="20" width="1160" height="60" rx="12" fill="#27272A"/>
    <circle cx="55" cy="50" r="7" fill="#EF4444"/>
    <circle cx="80" cy="50" r="7" fill="#FBBF24"/>
    <circle cx="105" cy="50" r="7" fill="#22C55E"/>
    <rect x="160" y="35" width="700" height="30" rx="15" fill="#18181B"/>
    <text x="180" y="55" fill="#71717A" font-family="monospace,monospace" font-size="12">https://goalapp-frontend-web.onrender.com/live</text>
  </g>

  <g transform="translate(20 80)">
    <!-- Nav -->
    <rect x="0" y="0" width="1160" height="50" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    <text x="30" y="32" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="14" font-weight="600">GoalApp</text>
    <g transform="translate(180 18)" fill="#A1A1AA">
      <text x="0" y="14" font-family="Roboto, sans-serif" font-size="12">Liga Élite ▾</text>
    </g>
    <g transform="translate(900 18)" fill="#A1A1AA">
      <text x="0" y="14" font-family="Roboto, sans-serif" font-size="12">Dashboard</text>
      <text x="80" y="14" font-family="Roboto, sans-serif" font-size="12">Calendario</text>
      <text x="170" y="14" font-family="Roboto, sans-serif" font-size="12">Equipos</text>
    </g>
    <circle cx="1100" cy="25" r="14" fill="#BEF264"/>
    <text x="1100" y="30" text-anchor="middle" fill="#18181B" font-family="Roboto, sans-serif" font-size="13" font-weight="700">AC</text>

    <!-- Body -->
    <rect x="0" y="50" width="1160" height="620" fill="url(#bgGoalLive)"/>

    <!-- Header with live indicator -->
    <g transform="translate(40 100)">
      <path d="M0 0 L8 0 L0 12 Z" fill="#A1A1AA"/>
      <circle cx="22" cy="6" r="6" fill="#EF4444"/>
      <circle cx="22" cy="6" r="6" fill="#EF4444" opacity="0.4">
        <animate attributeName="r" values="6;12;6" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="44" y="14" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="24" font-weight="700">Partidos en vivo</text>
      <text x="44" y="40" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="13">Resultados en vivo este momento</text>
    </g>

    <!-- Stats row -->
    <g transform="translate(40 160)">
      <rect x="0" y="0" width="350" height="80" rx="10" fill="#27272A"/>
      <text x="20" y="30" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="11" letter-spacing="2">PARTIDOS EN VIVO</text>
      <text x="20" y="62" fill="#EF4444" font-family="Roboto, sans-serif" font-size="32" font-weight="700">2</text>
      <text x="80" y="62" fill="#71717A" font-family="Roboto, sans-serif" font-size="12">de 8 totales</text>
    </g>
    <g transform="translate(405 160)">
      <rect x="0" y="0" width="350" height="80" rx="10" fill="#27272A"/>
      <text x="20" y="30" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="11" letter-spacing="2">GOLES TOTALES</text>
      <text x="20" y="62" fill="#BEF264" font-family="Roboto, sans-serif" font-size="32" font-weight="700">5</text>
      <text x="80" y="62" fill="#71717A" font-family="Roboto, sans-serif" font-size="12">en este momento</text>
    </g>
    <g transform="translate(770 160)">
      <rect x="0" y="0" width="350" height="80" rx="10" fill="#27272A"/>
      <text x="20" y="30" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="11" letter-spacing="2">GOLES POR PARTIDO</text>
      <text x="20" y="62" fill="#3B82F6" font-family="Roboto, sans-serif" font-size="32" font-weight="700">2.5</text>
      <text x="120" y="62" fill="#71717A" font-family="Roboto, sans-serif" font-size="12">promedio</text>
    </g>

    <!-- Match cards section header -->
    <g transform="translate(40 270)">
      <text x="0" y="0" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="16" font-weight="600">Todos los partidos</text>
      <rect x="200" y="-15" width="28" height="20" rx="10" fill="#7F1D1D"/>
      <text x="214" y="0" text-anchor="middle" fill="#FECACA" font-family="Roboto, sans-serif" font-size="11" font-weight="700">2</text>
    </g>

    <!-- Match 1 (larger) -->
    <g transform="translate(40 290)">
      <rect x="0" y="0" width="1080" height="180" rx="12" fill="#27272A" stroke="#7F1D1D" stroke-width="2"/>

      <!-- Header with LIVE badge -->
      <g transform="translate(20 20)">
        <circle cx="6" cy="10" r="5" fill="#EF4444"/>
        <circle cx="6" cy="10" r="5" fill="#EF4444" opacity="0.4">
          <animate attributeName="r" values="5;10;5" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;0;0.6" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <text x="20" y="14" fill="#EF4444" font-family="Roboto, sans-serif" font-size="12" font-weight="700">EN VIVO</text>
        <text x="100" y="14" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="12">· Minuto 67'</text>
        <text x="180" y="14" fill="#71717A" font-family="Roboto, sans-serif" font-size="11">Liga Élite</text>
      </g>

      <!-- Score -->
      <g transform="translate(0 70)">
        <text x="280" y="20" text-anchor="end" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="20" font-weight="600">FC Barcelona</text>
        <circle cx="300" cy="10" r="14" fill="#A21CAF"/>

        <text x="540" y="30" text-anchor="middle" fill="#BEF264" font-family="Roboto, sans-serif" font-size="48" font-weight="800">2 - 1</text>

        <text x="800" y="20" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="20" font-weight="600">Real Madrid</text>
        <circle cx="820" cy="10" r="14" fill="#FFFFFF"/>
      </g>

      <!-- Events timeline -->
      <g transform="translate(40 130)">
        <text x="0" y="0" fill="#71717A" font-family="Roboto, sans-serif" font-size="11">⚽ 23' Messi (BAR)</text>
        <text x="160" y="0" fill="#71717A" font-family="Roboto, sans-serif" font-size="11">⚽ 45' Benzema (RMA)</text>
        <text x="320" y="0" fill="#71717A" font-family="Roboto, sans-serif" font-size="11">⚽ 67' Pedri (BAR)</text>
        <text x="480" y="0" fill="#FBBF24" font-family="Roboto, sans-serif" font-size="11">🟨 71' Casemiro (RMA)</text>
      </g>

      <!-- Actions -->
      <g transform="translate(750 130)">
        <rect x="0" y="0" width="80" height="32" rx="8" fill="#3F3F46" stroke="#52525B" stroke-width="1"/>
        <text x="40" y="20" text-anchor="middle" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="11">🏆 Eventos</text>
        <rect x="90" y="0" width="100" height="32" rx="8" fill="#3F3F46" stroke="#52525B" stroke-width="1"/>
        <text x="140" y="20" text-anchor="middle" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="11">👥 Alineación</text>
        <rect x="200" y="0" width="100" height="32" rx="8" fill="#7F1D1D"/>
        <text x="250" y="20" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="11">🔒 Finalizar</text>
      </g>
    </g>

    <!-- Match 2 -->
    <g transform="translate(40 490)">
      <rect x="0" y="0" width="1080" height="160" rx="12" fill="#27272A" stroke="#7F1D1D" stroke-width="2"/>

      <g transform="translate(20 20)">
        <circle cx="6" cy="10" r="5" fill="#EF4444"/>
        <circle cx="6" cy="10" r="5" fill="#EF4444" opacity="0.4">
          <animate attributeName="r" values="5;10;5" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;0;0.6" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <text x="20" y="14" fill="#EF4444" font-family="Roboto, sans-serif" font-size="12" font-weight="700">EN VIVO</text>
        <text x="100" y="14" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="12">· Minuto 38'</text>
        <text x="180" y="14" fill="#71717A" font-family="Roboto, sans-serif" font-size="11">Liga Élite</text>
      </g>

      <g transform="translate(0 70)">
        <text x="280" y="20" text-anchor="end" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="20" font-weight="600">Sevilla FC</text>
        <circle cx="300" cy="10" r="14" fill="#EF4444"/>

        <text x="540" y="30" text-anchor="middle" fill="#BEF264" font-family="Roboto, sans-serif" font-size="48" font-weight="800">1 - 1</text>

        <text x="800" y="20" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="20" font-weight="600">Atlético Madrid</text>
        <circle cx="820" cy="10" r="14" fill="#BEF264"/>
      </g>

      <g transform="translate(40 130)">
        <text x="0" y="0" fill="#71717A" font-family="Roboto, sans-serif" font-size="11">⚽ 15' Ocampos (SEV)</text>
        <text x="160" y="0" fill="#71717A" font-family="Roboto, sans-serif" font-size="11">⚽ 38' Griezmann (ATM)</text>
      </g>

      <g transform="translate(750 130)">
        <rect x="0" y="0" width="80" height="32" rx="8" fill="#3F3F46" stroke="#52525B" stroke-width="1"/>
        <text x="40" y="20" text-anchor="middle" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="11">🏆 Eventos</text>
        <rect x="90" y="0" width="100" height="32" rx="8" fill="#3F3F46" stroke="#52525B" stroke-width="1"/>
        <text x="140" y="20" text-anchor="middle" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="11">👥 Alineación</text>
      </g>
    </g>
  </g>

  <text x="600" y="730" text-anchor="middle" fill="#3F3F46" font-family="monospace,monospace" font-size="10" letter-spacing="3">MOCKUP · GOALAPP LIVE · TIEMPO REAL</text>
</svg>

        <text x="0" y="16" fill="#475569" font-family="Roboto, sans-serif" font-size="13" font-weight="700">15</text>
      </g>
      <g transform="translate(820 30)">
        <rect x="0" y="0" width="76" height="26" rx="13" fill="#D1FAE5"/>
        <circle cx="14" cy="13" r="4" fill="#10B981"/>
        <text x="46" y="17" text-anchor="middle" fill="#065F46" font-family="Roboto, sans-serif" font-size="11" font-weight="600">Activo</text>
      </g>
      <g transform="translate(820 70)">
        <rect x="0" y="0" width="86" height="32" rx="6" fill="none" stroke="#CBD5E1"/>
        <text x="43" y="20" text-anchor="middle" fill="#475569" font-family="Roboto, sans-serif" font-size="11" font-weight="500">Editar</text>
      </g>
      <g transform="translate(916 70)">
        <rect x="0" y="0" width="86" height="32" rx="6" fill="none" stroke="#CBD5E1"/>
        <text x="43" y="20" text-anchor="middle" fill="#475569" font-family="Roboto, sans-serif" font-size="11" font-weight="500">Respuestas</text>
      </g>
      <g transform="translate(1012 70)">
        <rect x="0" y="0" width="86" height="32" rx="6" fill="none" stroke="#FECACA"/>
        <text x="43" y="20" text-anchor="middle" fill="#B91C1C" font-family="Roboto, sans-serif" font-size="11" font-weight="500">Eliminar</text>
      </g>
    </g>

    <!-- Card 3: Inactive -->
    <g transform="translate(40 450)">
      <rect x="0" y="0" width="1120" height="120" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <g transform="translate(24 24)">
        <rect x="0" y="0" width="44" height="44" rx="8" fill="#F1F5F9"/>
        <path d="M14 16 L30 16 L26 12 L18 12 Z M14 22 L30 22 M14 28 L26 28" stroke="#0F172A" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="84" y="48" fill="#0F172A" font-family="Roboto, sans-serif" font-size="16" font-weight="600">Solicitud de soporte técnico</text>
      <text x="84" y="70" fill="#64748B" font-family="Roboto, sans-serif" font-size="12">Recoge incidencias de usuarios · 4 preguntas</text>
      <g transform="translate(84 84)">
        <text x="0" y="0" fill="#94A3B8" font-family="monospace,monospace" font-size="10">SLUG</text>
        <text x="0" y="16" fill="#475569" font-family="monospace,monospace" font-size="11">/f/soporte</text>
      </g>
      <g transform="translate(280 84)">
        <text x="0" y="0" fill="#94A3B8" font-family="monospace,monospace" font-size="10">RESPUESTAS</text>
        <text x="0" y="16" fill="#475569" font-family="Roboto, sans-serif" font-size="13" font-weight="700">4</text>
      </g>
      <g transform="translate(820 30)">
        <rect x="0" y="0" width="86" height="26" rx="13" fill="#F1F5F9"/>
        <circle cx="14" cy="13" r="4" fill="#94A3B8"/>
        <text x="51" y="17" text-anchor="middle" fill="#475569" font-family="Roboto, sans-serif" font-size="11" font-weight="600">Inactivo</text>
      </g>
      <g transform="translate(820 70)">
        <rect x="0" y="0" width="86" height="32" rx="6" fill="none" stroke="#CBD5E1"/>
        <text x="43" y="20" text-anchor="middle" fill="#475569" font-family="Roboto, sans-serif" font-size="11" font-weight="500">Editar</text>
      </g>
      <g transform="translate(916 70)">
        <rect x="0" y="0" width="86" height="32" rx="6" fill="none" stroke="#CBD5E1"/>
        <text x="43" y="20" text-anchor="middle" fill="#475569" font-family="Roboto, sans-serif" font-size="11" font-weight="500">Respuestas</text>
      </g>
      <g transform="translate(1012 70)">
        <rect x="0" y="0" width="86" height="32" rx="6" fill="none" stroke="#FECACA"/>
        <text x="43" y="20" text-anchor="middle" fill="#B91C1C" font-family="Roboto, sans-serif" font-size="11" font-weight="500">Eliminar</text>
      </g>
    </g>
  </g>

  <text x="600" y="730" text-anchor="middle" fill="#94A3B8" font-family="monospace,monospace" font-size="10" letter-spacing="3">MOCKUP · FORMPROJECT DASHBOARD</text>
</svg>

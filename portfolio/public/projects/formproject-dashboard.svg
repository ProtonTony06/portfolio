      <text x="20" y="26" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="13" font-weight="600">+ Nuevo formulario</text>
    </g>

    <!-- Form cards -->
    <g transform="translate(40 170)">
      <!-- Card 1: Active -->
      <rect x="0" y="0" width="1120" height="120" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <g transform="translate(24 24)">
        <rect x="0" y="0" width="44" height="44" rx="8" fill="#F1F5F9"/>

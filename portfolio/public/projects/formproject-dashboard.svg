<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="FormProject - Dashboard admin">
  <title>FormProject - Dashboard admin</title>
  <desc>Mockup del dashboard admin con lista de formularios, badges de estado y botón de crear.</desc>

  <defs>
    <linearGradient id="bgFPDash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgFPDash)"/>

  <!-- Browser chrome -->
  <g>
    <rect x="20" y="20" width="1160" height="60" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="55" cy="50" r="7" fill="#EF4444"/>
    <circle cx="80" cy="50" r="7" fill="#FBBF24"/>
    <circle cx="105" cy="50" r="7" fill="#22C55E"/>
    <rect x="160" y="35" width="700" height="30" rx="15" fill="#F1F5F9"/>
    <text x="180" y="55" fill="#64748B" font-family="monospace,monospace" font-size="12">form.antoniocuevas.dev/admin</text>
  </g>

  <g transform="translate(20 80)">
    <!-- Nav top -->
    <rect x="0" y="0" width="1160" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <g transform="translate(30 18)">
      <rect x="0" y="0" width="22" height="22" rx="5" fill="#0F172A"/>
      <path d="M6 8 L11 13 L16 8 M6 14 L11 19 L16 14" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="62" y="36" fill="#0F172A" font-family="Roboto, sans-serif" font-size="16" font-weight="700">FormProject</text>
    <g transform="translate(880 18)" fill="#475569">
      <text x="0" y="18" font-family="Roboto, sans-serif" font-size="13">Formularios</text>
      <text x="110" y="18" font-family="Roboto, sans-serif" font-size="13">Respuestas</text>
      <text x="210" y="18" font-family="Roboto, sans-serif" font-size="13">Ajustes</text>
    </g>
    <circle cx="1110" cy="30" r="16" fill="#0F172A"/>
    <text x="1110" y="35" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="13" font-weight="700">AC</text>

    <!-- Body -->
    <rect x="0" y="60" width="1160" height="610" fill="url(#bgFPDash)"/>

    <!-- Header section -->
    <text x="40" y="110" fill="#0F172A" font-family="Roboto, sans-serif" font-size="28" font-weight="700">Mis formularios</text>
    <text x="40" y="134" fill="#64748B" font-family="Roboto, sans-serif" font-size="13">3 formularios · 47 respuestas en total</text>


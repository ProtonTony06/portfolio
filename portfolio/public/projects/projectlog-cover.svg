<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Project_Log - Portada del proyecto">
  <title>Project_Log - Portada</title>
  <desc>Portada representativa del proyecto Project_Log con branding y un mockup de terminal con logs en vivo.</desc>

  <defs>
    <linearGradient id="bgCoverPL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1F1A"/>
      <stop offset="1" stop-color="#030706"/>
    </linearGradient>

    <linearGradient id="logoCoverPL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#00770D"/>
    </linearGradient>

    <radialGradient id="logoGlowPL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gridPatternPL" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.05"/>
    </pattern>

    <!-- Terminal con lista de logs -->
    <symbol id="terminalCoverPL" viewBox="0 0 600 380">
      <rect width="600" height="380" fill="#0B1512"/>
      <!-- Barra de título tipo terminal -->
      <rect x="0" y="0" width="600" height="34" fill="#101F1A"/>
      <circle cx="20" cy="17" r="5" fill="#EF4444"/>
      <circle cx="38" cy="17" r="5" fill="#FBBF24"/>
      <circle cx="56" cy="17" r="5" fill="#22C55E"/>
      <text x="300" y="21" text-anchor="middle" fill="#6B8578" font-family="monospace,monospace" font-size="10">~/project_log &#8212; ingesta + panel</text>
      <line x1="0" y1="34" x2="600" y2="34" stroke="#10B981" stroke-opacity="0.25" stroke-width="1"/>

      <!-- Prompt inicial -->
      <text x="20" y="66" fill="#5CE55A" font-family="monospace,monospace" font-size="13" font-weight="600">$ ls ~/project_log</text>
      <text x="20" y="88" fill="#6B8578" font-family="monospace,monospace" font-size="11">ingest/&#160;&#160;panel/&#160;&#160;postgres/&#160;&#160;nginx/</text>

      <!-- Líneas de log con niveles -->
      <g font-family="monospace,monospace" font-size="11">
        <g transform="translate(20 118)">
          <rect x="0" y="0" width="42" height="16" rx="3" fill="#EF4444" fill-opacity="0.18"/>
          <text x="6" y="12" fill="#EF4444" font-weight="700">ERROR</text>
          <text x="52" y="12" fill="#4E6157">10:21:04</text>
          <text x="124" y="12" fill="#C8DBC7">payment-service &#8220;Timeout esperando confirmación&#8221;</text>
        </g>
        <g transform="translate(20 144)">
          <rect x="0" y="0" width="42" height="16" rx="3" fill="#FBBF24" fill-opacity="0.15"/>
          <text x="6" y="12" fill="#FBBF24" font-weight="700">WARN</text>
          <text x="52" y="12" fill="#4E6157">10:21:09</text>
          <text x="124" y="12" fill="#C8DBC7">api-gateway &#8220;Rate limit cerca del umbral&#8221;</text>
        </g>
        <g transform="translate(20 170)">
          <rect x="0" y="0" width="42" height="16" rx="3" fill="#22C55E" fill-opacity="0.15"/>
          <text x="6" y="12" fill="#22C55E" font-weight="700">INFO</text>
          <text x="52" y="12" fill="#4E6157">10:21:12</text>
          <text x="124" y="12" fill="#C8DBC7">project-log &#8220;Lote de 128 logs ingestado&#8221;</text>
        </g>
        <g transform="translate(20 196)">
          <rect x="0" y="0" width="42" height="16" rx="3" fill="#22C55E" fill-opacity="0.15"/>
          <text x="6" y="12" fill="#22C55E" font-weight="700">INFO</text>
          <text x="52" y="12" fill="#4E6157">10:21:15</text>
          <text x="124" y="12" fill="#C8DBC7">portfolio &#8220;Deploy finalizado en VM&#8221;</text>
        </g>
        <g transform="translate(20 222)">
          <rect x="0" y="0" width="42" height="16" rx="3" fill="#EF4444" fill-opacity="0.18"/>
          <text x="6" y="12" fill="#EF4444" font-weight="700">ERROR</text>
          <text x="52" y="12" fill="#4E6157">10:21:19</text>
          <text x="124" y="12" fill="#C8DBC7">goalapp &#8220;Fallo de conexión con Realtime&#8221;</text>
        </g>
        <g transform="translate(20 248)" opacity="0.75">
          <rect x="0" y="0" width="42" height="16" rx="3" fill="#22C55E" fill-opacity="0.15"/>
          <text x="6" y="12" fill="#22C55E" font-weight="700">INFO</text>
          <text x="52" y="12" fill="#4E6157">10:21:23</text>
          <text x="124" y="12" fill="#C8DBC7">form-project &#8220;10 respuestas nuevas&#8221;</text>
        </g>
      </g>

      <!-- Banda en vivo -->
      <rect x="0" y="330" width="600" height="50" fill="#08100D"/>
      <line x1="0" y1="330" x2="600" y2="330" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="30" cy="355" r="5" fill="#22C55E"/>
      <circle cx="30" cy="355" r="10" fill="#22C55E" fill-opacity="0.2"/>
      <text x="48" y="359" fill="#5CE55A" font-family="monospace,monospace" font-size="12" font-weight="600" letter-spacing="1">En vivo</text>
      <text x="580" y="359" text-anchor="end" fill="#4E6157" font-family="monospace,monospace" font-size="10">WS &#183; conectado</text>
    </symbol>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="630" fill="url(#bgCoverPL)"/>
  <rect width="1200" height="630" fill="url(#gridPatternPL)"/>

  <!-- Glow ambiental -->
  <circle cx="280" cy="315" r="280" fill="url(#logoGlowPL)"/>

  <!-- Branding izquierdo -->
  <g transform="translate(60 90)">
    <!-- Tag -->
    <g>
      <rect x="0" y="0" width="252" height="32" rx="16" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5"/>
      <circle cx="22" cy="16" r="4" fill="#10B981"/>
      <text x="38" y="21" fill="#10B981" font-family="monospace,monospace" font-size="11" font-weight="600" letter-spacing="2">SPRING BOOT · REACT · POSTGRESQL</text>
    </g>

    <!-- Prompt sobre el título -->
    <text x="0" y="82" fill="#5CE55A" font-family="monospace,monospace" font-size="16" font-weight="600">$ ls ~/project_log</text>

    <!-- Título -->
    <text x="0" y="138" fill="#FFFFFF" font-family="monospace,monospace" font-size="56" font-weight="800" letter-spacing="-1.5">Project_Log</text>

    <!-- Subtítulo -->
    <text x="0" y="182" fill="#BFC2C6" font-family="monospace,monospace" font-size="17" font-weight="400">Logging centralizado con streaming en vivo</text>

    <!-- Descripción -->
    <text x="0" y="224" fill="#888A8D" font-family="monospace,monospace" font-size="14" font-weight="400">Ingesta REST con API key por proyecto, panel web</text>
    <text x="0" y="246" fill="#888A8D" font-family="monospace,monospace" font-size="14" font-weight="400">con filtros combinables y WebSocket en vivo.</text>

    <!-- Tech badges -->
    <g transform="translate(0 278)">
      <g>
        <rect x="0" y="0" width="108" height="32" rx="8" fill="#1A1C1E" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
        <text x="54" y="21" text-anchor="middle" fill="#5CE55A" font-family="monospace,monospace" font-size="12" font-weight="500">Spring Boot</text>
      </g>
      <g transform="translate(118 0)">
        <rect x="0" y="0" width="66" height="32" rx="8" fill="#1A1C1E" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
        <text x="33" y="21" text-anchor="middle" fill="#5CE55A" font-family="monospace,monospace" font-size="12" font-weight="500">React</text>
      </g>
      <g transform="translate(194 0)">
        <rect x="0" y="0" width="100" height="32" rx="8" fill="#1A1C1E" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
        <text x="50" y="21" text-anchor="middle" fill="#5CE55A" font-family="monospace,monospace" font-size="12" font-weight="500">PostgreSQL</text>
      </g>
      <g transform="translate(304 0)">
        <rect x="0" y="0" width="70" height="32" rx="8" fill="#1A1C1E" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
        <text x="35" y="21" text-anchor="middle" fill="#5CE55A" font-family="monospace,monospace" font-size="12" font-weight="500">Docker</text>
      </g>
    </g>

    <!-- Año -->
    <text x="0" y="372" fill="#464749" font-family="monospace,monospace" font-size="14" font-weight="500" letter-spacing="2">2026 · DOCKER · SDD</text>
  </g>

  <!-- Showcase derecho: terminal -->
  <g transform="translate(640 90)">
    <rect x="0" y="0" width="520" height="400" rx="12" fill="#0B1512" stroke="#10B981" stroke-width="2" stroke-opacity="0.5"/>
    <use href="#terminalCoverPL" x="10" y="10" width="500" height="380" rx="10"/>
    <!-- Marca de mockup -->
    <text x="260" y="440" text-anchor="middle" fill="#464749" font-family="monospace,monospace" font-size="9" font-weight="600" letter-spacing="3">REPRESENTATIVE MOCKUPS · NOT REAL CAPTURES</text>
  </g>

  <!-- Esquinas -->
  <g stroke="#10B981" stroke-width="2" fill="none" stroke-opacity="0.6">
    <path d="M30 30 L30 60 M30 30 L60 30"/>
    <path d="M1170 30 L1170 60 M1170 30 L1140 30"/>
    <path d="M30 600 L30 570 M30 600 L60 600"/>
    <path d="M1170 600 L1170 570 M1170 600 L1140 600"/>
  </g>
</svg>

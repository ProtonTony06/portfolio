<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" role="img" aria-label="PasswordManager - Password list screen mockup">
  <title>PasswordManager Lista</title>
  <desc>Mockup representativo de la lista de contraseñas con búsqueda, filtros y entradas de ejemplo.</desc>

  <defs>
    <linearGradient id="bgDark4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1C1E"/>
      <stop offset="1" stop-color="#0F1012"/>
    </linearGradient>
  </defs>

  <rect width="360" height="720" fill="url(#bgDark4)"/>

  <!-- Status bar -->
  <text x="24" y="30" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="12" font-weight="500">9:41</text>
  <g transform="translate(310 18)" fill="#E1E2E6">
    <rect x="0" y="6" width="3" height="6" rx="0.5"/>
    <rect x="5" y="4" width="3" height="8" rx="0.5"/>
    <rect x="10" y="2" width="3" height="10" rx="0.5"/>
    <rect x="15" y="0" width="3" height="12" rx="0.5"/>
  </g>

  <!-- TopAppBar -->
  <rect x="0" y="50" width="360" height="64" fill="#1A1C1E"/>
  <g transform="translate(16 72)" fill="#BFC2C6">
    <path d="M16 0 L14 2 L8 8 L14 14 L16 16 L6 8 Z"/>
  </g>
  <text x="180" y="89" text-anchor="middle" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="18" font-weight="600">Contraseñas</text>
  <g transform="translate(316 72)" fill="#BFC2C6">
    <path d="M11 2 C7 2 3 6 3 11 C3 16 7 20 11 20 C15 20 19 16 19 11 C19 6 15 2 11 2 Z M10 7 L12 7 L12 12 L10 12 Z M10 14 L12 14 L12 16 L10 16 Z"/>
  </g>

  <!-- Search bar -->
  <g transform="translate(16 130)">
    <rect x="0" y="0" width="328" height="48" rx="24" fill="#2F3133"/>
    <g transform="translate(16 16)" fill="#888A8D">
      <circle cx="9" cy="9" r="7" fill="none" stroke="#888A8D" stroke-width="1.5"/>
      <line x1="14" y1="14" x2="18" y2="18" stroke="#888A8D" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text x="44" y="29" fill="#888A8D" font-family="Roboto, sans-serif" font-size="14">Buscar contraseña...</text>
  </g>

  <!-- Filter chips -->
  <g transform="translate(16 192)">
    <rect x="0" y="0" width="68" height="32" rx="16" fill="#8849F5"/>
    <text x="34" y="20" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="12" font-weight="500">Todas</text>

    <rect x="76" y="0" width="80" height="32" rx="16" fill="none" stroke="#6F7073" stroke-width="1"/>
    <text x="116" y="20" text-anchor="middle" fill="#EDE2FF" font-family="Roboto, sans-serif" font-size="12" font-weight="500">Redes</text>

    <rect x="164" y="0" width="72" height="32" rx="16" fill="none" stroke="#6F7073" stroke-width="1"/>
    <text x="200" y="20" text-anchor="middle" fill="#EDE2FF" font-family="Roboto, sans-serif" font-size="12" font-weight="500">Email</text>

    <rect x="244" y="0" width="84" height="32" rx="16" fill="none" stroke="#6F7073" stroke-width="1"/>
    <text x="286" y="20" text-anchor="middle" fill="#EDE2FF" font-family="Roboto, sans-serif" font-size="12" font-weight="500">Banca</text>
  </g>

  <!-- Password entry 1 (Red social - example.com) -->
  <g transform="translate(16 248)">
    <rect x="0" y="0" width="328" height="72" rx="12" fill="#2F3133"/>
    <!-- Avatar icon (circle "E" for example.com) -->
    <circle cx="36" cy="36" r="20" fill="#3B82F6"/>
    <text x="36" y="42" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="16" font-weight="700">E</text>

    <text x="68" y="30" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="15" font-weight="500">Example Site</text>
    <text x="68" y="50" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="12">user@example.com</text>

    <!-- Star (favorite) -->
    <path d="M10 0 L12.5 7 L20 7 L14 11.5 L16.5 19 L10 14.5 L3.5 19 L6 11.5 L0 7 L7.5 7 Z" transform="translate(282 20)" fill="#FFB582"/>

    <!-- Strength bars -->
    <g transform="translate(68 56)">
      <rect x="0" y="0" width="14" height="3" rx="1.5" fill="#5CE55A"/>
      <rect x="16" y="0" width="14" height="3" rx="1.5" fill="#5CE55A"/>
      <rect x="32" y="0" width="14" height="3" rx="1.5" fill="#5CE55A"/>
    </g>
  </g>

  <!-- Password entry 2 (GitHub) -->
  <g transform="translate(16 332)">
    <rect x="0" y="0" width="328" height="72" rx="12" fill="#2F3133"/>
    <circle cx="36" cy="36" r="20" fill="#1F2937"/>
    <text x="36" y="42" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="14" font-weight="700">G</text>

    <text x="68" y="30" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="15" font-weight="500">GitHub</text>
    <text x="68" y="50" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="12">demo@demo.com</text>

    <path d="M10 0 L12.5 7 L20 7 L14 11.5 L16.5 19 L10 14.5 L3.5 19 L6 11.5 L0 7 L7.5 7 Z" transform="translate(282 20)" fill="#464749"/>

    <g transform="translate(68 56)">
      <rect x="0" y="0" width="14" height="3" rx="1.5" fill="#5CE55A"/>
      <rect x="16" y="0" width="14" height="3" rx="1.5" fill="#5CE55A"/>
      <rect x="32" y="0" width="14" height="3" rx="1.5" fill="#5CE55A"/>
    </g>
  </g>

  <!-- Password entry 3 (Bank - weak) -->
  <g transform="translate(16 416)">
    <rect x="0" y="0" width="328" height="72" rx="12" fill="#2F3133"/>
    <circle cx="36" cy="36" r="20" fill="#10B981"/>
    <text x="36" y="42" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="14" font-weight="700">B</text>

    <text x="68" y="30" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="15" font-weight="500">Banco Demo</text>
    <text x="68" y="50" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="12">12345678A</text>

    <path d="M10 0 L12.5 7 L20 7 L14 11.5 L16.5 19 L10 14.5 L3.5 19 L6 11.5 L0 7 L7.5 7 Z" transform="translate(282 20)" fill="#FFB582"/>

    <!-- Strength (1/3 red - weak) -->
    <g transform="translate(68 56)">
      <rect x="0" y="0" width="14" height="3" rx="1.5" fill="#BA1A1A"/>
      <rect x="16" y="0" width="14" height="3" rx="1.5" fill="#464749"/>
      <rect x="32" y="0" width="14" height="3" rx="1.5" fill="#464749"/>
    </g>
  </g>

  <!-- Password entry 4 (Netflix-like) -->
  <g transform="translate(16 500)">
    <rect x="0" y="0" width="328" height="72" rx="12" fill="#2F3133"/>
    <circle cx="36" cy="36" r="20" fill="#DC2626"/>
    <text x="36" y="42" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="14" font-weight="700">N</text>

    <text x="68" y="30" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="15" font-weight="500">Streaming Demo</text>
    <text x="68" y="50" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="12">streaming@demo.com</text>

    <path d="M10 0 L12.5 7 L20 7 L14 11.5 L16.5 19 L10 14.5 L3.5 19 L6 11.5 L0 7 L7.5 7 Z" transform="translate(282 20)" fill="#464749"/>

    <!-- Strength (2/3 yellow - medium) -->
    <g transform="translate(68 56)">
      <rect x="0" y="0" width="14" height="3" rx="1.5" fill="#FFB582"/>
      <rect x="16" y="0" width="14" height="3" rx="1.5" fill="#FFB582"/>
      <rect x="32" y="0" width="14" height="3" rx="1.5" fill="#464749"/>
    </g>
  </g>

  <!-- Password entry 5 (Email - Outlook-like) -->
  <g transform="translate(16 584)">
    <rect x="0" y="0" width="328" height="72" rx="12" fill="#2F3133"/>
    <circle cx="36" cy="36" r="20" fill="#0EA5E9"/>
    <text x="36" y="42" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="14" font-weight="700">M</text>

    <text x="68" y="30" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="15" font-weight="500">Mail Demo</text>
    <text x="68" y="50" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="12">demo@email.com</text>

    <path d="M10 0 L12.5 7 L20 7 L14 11.5 L16.5 19 L10 14.5 L3.5 19 L6 11.5 L0 7 L7.5 7 Z" transform="translate(282 20)" fill="#FFB582"/>

    <g transform="translate(68 56)">
      <rect x="0" y="0" width="14" height="3" rx="1.5" fill="#5CE55A"/>
      <rect x="16" y="0" width="14" height="3" rx="1.5" fill="#5CE55A"/>
      <rect x="32" y="0" width="14" height="3" rx="1.5" fill="#5CE55A"/>
    </g>
  </g>

  <!-- FAB -->
  <circle cx="316" cy="676" r="28" fill="#8849F5"/>
  <g transform="translate(302 662)" fill="#FFFFFF">
    <rect x="12" y="0" width="4" height="28" rx="1"/>
    <rect x="0" y="12" width="28" height="4" rx="1"/>
  </g>

  <text x="180" y="704" text-anchor="middle" fill="#464749" font-family="monospace" font-size="10">MOCKUP · MATERIAL 3 · DARK</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="PasswordManager - Portada del proyecto">
  <title>PasswordManager - Portada</title>
  <desc>Portada representativa del proyecto PasswordManager con logo, mockups de móvil y branding.</desc>

  <defs>
    <!-- Fondo gradient: emerald cyber minimalism coherente con el portfolio -->
    <linearGradient id="bgCover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1F1A"/>
      <stop offset="1" stop-color="#030706"/>
    </linearGradient>

    <!-- Gradiente del logo -->
    <linearGradient id="logoCover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#00770D"/>
    </linearGradient>

    <!-- Glow del logo -->
    <radialGradient id="logoGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <!-- Phone screens background -->
    <linearGradient id="phoneScreen1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1C1E"/>
      <stop offset="1" stop-color="#0F1012"/>
    </linearGradient>

    <linearGradient id="phoneScreen2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F3133"/>
      <stop offset="1" stop-color="#1A1C1E"/>
    </linearGradient>

    <!-- Patrón de grid sutil -->
    <pattern id="gridPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.05"/>
    </pattern>

    <!-- Mockup login screen -->
    <symbol id="mockupLogin" viewBox="0 0 360 720">
      <rect width="360" height="720" fill="url(#phoneScreen1)"/>
      <rect x="106" y="100" width="100" height="100" rx="28" fill="#8849F5"/>
      <g transform="translate(135 125)" fill="#EDE2FF">
        <path d="M11 0 C7 0 4 3 4 7 L4 14 L2 14 C1 14 0 15 0 16 L0 32 C0 33 1 34 2 34 L20 34 C21 34 22 33 22 32 L22 16 C22 15 21 14 20 14 L18 14 L18 7 C18 3 15 0 11 0 Z M7 7 C7 5 9 3 11 3 C13 3 15 5 15 7 L15 14 L7 14 Z" />
        <circle cx="11" cy="23" r="2.5"/>
      </g>
      <text x="156" y="248" text-anchor="middle" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="22" font-weight="700">PasswordManager</text>
      <text x="156" y="274" text-anchor="middle" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="13">Desbloquea tu bóveda</text>
      <rect x="24" y="330" width="312" height="44" rx="4" fill="none" stroke="#6F7073" stroke-width="1"/>
      <rect x="24" y="410" width="312" height="44" rx="20" fill="#8849F5"/>
      <text x="180" y="438" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="14" font-weight="600">Iniciar Sesión</text>
      <rect x="24" y="470" width="312" height="44" rx="20" fill="none" stroke="#6F7073" stroke-width="1.5"/>
      <text x="180" y="498" text-anchor="middle" fill="#EDE2FF" font-family="Roboto, sans-serif" font-size="14" font-weight="500">Usar Biometría</text>
      <rect x="24" y="566" width="312" height="100" rx="12" fill="#2F3133"/>
      <text x="42" y="595" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="11" font-weight="600">⚠ ¿Olvidaste tu contraseña?</text>
      <text x="42" y="618" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="9">Por seguridad, NO hay recuperación</text>
      <text x="42" y="632" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="9">de password. Solo tú tienes acceso.</text>
    </symbol>

    <!-- Mockup generator screen -->
    <symbol id="mockupGenerator" viewBox="0 0 360 720">
      <rect width="360" height="720" fill="url(#phoneScreen1)"/>
      <text x="180" y="92" text-anchor="middle" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="16" font-weight="600">Generar Contraseña</text>
      <rect x="24" y="138" width="312" height="170" rx="16" fill="#2F3133"/>
      <text x="180" y="184" text-anchor="middle" fill="#E1E2E6" font-family="monospace,monospace" font-size="18" font-weight="600">K9#mP2$vL8nQ4</text>
      <rect x="86" y="200" width="40" height="6" rx="3" fill="#5CE55A"/>
      <rect x="132" y="200" width="40" height="6" rx="3" fill="#5CE55A"/>
      <rect x="178" y="200" width="40" height="6" rx="3" fill="#5CE55A"/>
      <text x="180" y="228" text-anchor="middle" fill="#5CE55A" font-family="Roboto, sans-serif" font-size="11">Fuerte</text>
      <rect x="40" y="248" width="135" height="44" rx="20" fill="#8849F5"/>
      <text x="108" y="276" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="13" font-weight="500">Generar</text>
      <rect x="185" y="248" width="135" height="44" rx="20" fill="#8849F5"/>
      <text x="252" y="276" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="13" font-weight="500">Copiar</text>
      <text x="24" y="362" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="14" font-weight="500">Longitud</text>
      <text x="336" y="362" text-anchor="end" fill="#8849F5" font-family="monospace,monospace" font-size="14" font-weight="600">20</text>
      <rect x="24" y="380" width="312" height="4" rx="2" fill="#464749"/>
      <rect x="24" y="380" width="187" height="4" rx="2" fill="#8849F5"/>
      <circle cx="211" cy="382" r="10" fill="#8849F5"/>
      <text x="24" y="438" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="13" font-weight="500">Tipos de caracteres</text>
      <text x="24" y="466" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="12">Mayúsculas (A-Z)</text>
      <rect x="288" y="456" width="40" height="20" rx="10" fill="#8849F5"/>
      <circle cx="320" cy="466" r="7" fill="#FFFFFF"/>
      <text x="24" y="500" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="12">Minúsculas (a-z)</text>
      <rect x="288" y="490" width="40" height="20" rx="10" fill="#8849F5"/>
      <circle cx="320" cy="500" r="7" fill="#FFFFFF"/>
      <text x="24" y="534" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="12">Números (0-9)</text>
      <rect x="288" y="524" width="40" height="20" rx="10" fill="#8849F5"/>
      <circle cx="320" cy="534" r="7" fill="#FFFFFF"/>
      <text x="24" y="568" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="12">Símbolos</text>
      <rect x="288" y="558" width="40" height="20" rx="10" fill="#8849F5"/>
      <circle cx="320" cy="568" r="7" fill="#FFFFFF"/>
    </symbol>

    <!-- Mockup list screen -->
    <symbol id="mockupList" viewBox="0 0 360 720">
      <rect width="360" height="720" fill="url(#phoneScreen1)"/>
      <text x="180" y="92" text-anchor="middle" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="16" font-weight="600">Contraseñas</text>
      <rect x="16" y="130" width="328" height="40" rx="20" fill="#2F3133"/>
      <text x="40" y="155" fill="#888A8D" font-family="Roboto, sans-serif" font-size="13">Buscar contraseña...</text>
      <rect x="16" y="186" width="68" height="28" rx="14" fill="#8849F5"/>
      <text x="50" y="204" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="11" font-weight="500">Todas</text>
      <rect x="92" y="186" width="64" height="28" rx="14" fill="none" stroke="#6F7073" stroke-width="1"/>
      <text x="124" y="204" text-anchor="middle" fill="#EDE2FF" font-family="Roboto, sans-serif" font-size="11" font-weight="500">Redes</text>
      <!-- Entry 1 -->
      <rect x="16" y="240" width="328" height="64" rx="12" fill="#2F3133"/>
      <circle cx="52" cy="272" r="20" fill="#3B82F6"/>
      <text x="52" y="278" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="14" font-weight="700">E</text>
      <text x="84" y="266" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="13" font-weight="500">Example Site</text>
      <text x="84" y="284" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="11">user@example.com</text>
      <rect x="84" y="290" width="14" height="3" rx="1.5" fill="#5CE55A"/>
      <rect x="100" y="290" width="14" height="3" rx="1.5" fill="#5CE55A"/>
      <rect x="116" y="290" width="14" height="3" rx="1.5" fill="#5CE55A"/>
      <!-- Entry 2 -->
      <rect x="16" y="316" width="328" height="64" rx="12" fill="#2F3133"/>
      <circle cx="52" cy="348" r="20" fill="#1F2937"/>
      <text x="52" y="354" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="13" font-weight="700">G</text>
      <text x="84" y="342" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="13" font-weight="500">GitHub</text>
      <text x="84" y="360" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="11">demo@demo.com</text>
      <rect x="84" y="366" width="14" height="3" rx="1.5" fill="#5CE55A"/>
      <rect x="100" y="366" width="14" height="3" rx="1.5" fill="#5CE55A"/>
      <rect x="116" y="366" width="14" height="3" rx="1.5" fill="#5CE55A"/>
      <!-- Entry 3 -->
      <rect x="16" y="392" width="328" height="64" rx="12" fill="#2F3133"/>
      <circle cx="52" cy="424" r="20" fill="#10B981"/>
      <text x="52" y="430" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="13" font-weight="700">B</text>
      <text x="84" y="418" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="13" font-weight="500">Banco Demo</text>
      <text x="84" y="436" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="11">12345678A</text>
      <rect x="84" y="442" width="14" height="3" rx="1.5" fill="#BA1A1A"/>
      <rect x="100" y="442" width="14" height="3" rx="1.5" fill="#464749"/>
      <rect x="116" y="442" width="14" height="3" rx="1.5" fill="#464749"/>
      <!-- Entry 4 -->
      <rect x="16" y="468" width="328" height="64" rx="12" fill="#2F3133"/>
      <circle cx="52" cy="500" r="20" fill="#DC2626"/>
      <text x="52" y="506" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="13" font-weight="700">N</text>
      <text x="84" y="494" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="13" font-weight="500">Streaming</text>
      <text x="84" y="512" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="11">streaming@demo.com</text>
      <rect x="84" y="518" width="14" height="3" rx="1.5" fill="#FFB582"/>
      <rect x="100" y="518" width="14" height="3" rx="1.5" fill="#FFB582"/>
      <rect x="116" y="518" width="14" height="3" rx="1.5" fill="#464749"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgCover)"/>
  <rect width="1200" height="630" fill="url(#gridPattern)"/>

  <!-- Glow ambient detrás del logo -->
  <circle cx="280" cy="315" r="280" fill="url(#logoGlow)"/>

  <!-- Sección izquierda: branding -->
  <g transform="translate(60 100)">
    <!-- Tag "OPEN SOURCE ANDROID" -->
    <g>
      <rect x="0" y="0" width="180" height="32" rx="16" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5"/>
      <circle cx="22" cy="16" r="4" fill="#10B981"/>
      <text x="38" y="21" fill="#10B981" font-family="monospace,monospace" font-size="11" font-weight="600" letter-spacing="2">ANDROID · OPEN SOURCE</text>
    </g>

    <!-- Título grande -->
    <text x="0" y="100" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">PasswordManager</text>

    <!-- Subtítulo -->
    <text x="0" y="148" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="18" font-weight="400">Cifrado híbrido · 100% local · Biometría</text>

    <!-- Descripción corta -->
    <text x="0" y="210" fill="#888A8D" font-family="Roboto, sans-serif" font-size="15" font-weight="400">Gestor de contraseñas privado para Android.</text>
    <text x="0" y="232" fill="#888A8D" font-family="Roboto, sans-serif" font-size="15" font-weight="400">SQLCipher + Android Keystore. Sin servidores.</text>

    <!-- Tech badges -->
    <g transform="translate(0 280)">
      <g>
        <rect x="0" y="0" width="78" height="32" rx="8" fill="#1A1C1E" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
        <text x="39" y="21" text-anchor="middle" fill="#5CE55A" font-family="monospace,monospace" font-size="12" font-weight="500">Kotlin</text>
      </g>
      <g transform="translate(88 0)">
        <rect x="0" y="0" width="130" height="32" rx="8" fill="#1A1C1E" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
        <text x="65" y="21" text-anchor="middle" fill="#5CE55A" font-family="monospace,monospace" font-size="12" font-weight="500">Jetpack Compose</text>
      </g>
      <g transform="translate(228 0)">
        <rect x="0" y="0" width="100" height="32" rx="8" fill="#1A1C1E" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
        <text x="50" y="21" text-anchor="middle" fill="#5CE55A" font-family="monospace,monospace" font-size="12" font-weight="500">SQLCipher</text>
      </g>
    </g>

    <!-- Año -->
    <text x="0" y="380" fill="#464749" font-family="monospace,monospace" font-size="14" font-weight="500" letter-spacing="2">2026 · MVP</text>
  </g>

  <!-- Sección derecha: mockups de móvil -->
  <g transform="translate(640 30)">
    <!-- Mockup 1: Generator (atrás, más pequeño y desplazado a la derecha) -->
    <g transform="translate(280 80) rotate(6 110 220)">
      <use href="#mockupGenerator" width="200" height="400" rx="24" opacity="0.85"/>
      <rect x="0" y="0" width="200" height="400" rx="24" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.2"/>
    </g>

    <!-- Mockup 2: List (en medio) -->
    <g transform="translate(140 100) rotate(-3 110 220)">
      <use href="#mockupList" width="200" height="400" rx="24" opacity="0.92"/>
      <rect x="0" y="0" width="200" height="400" rx="24" fill="none" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
    </g>

    <!-- Mockup 3: Login (delante) -->
    <g transform="translate(0 120)">
      <use href="#mockupLogin" width="200" height="400" rx="24"/>
      <!-- Marco del teléfono -->
      <rect x="0" y="0" width="200" height="400" rx="24" fill="none" stroke="#10B981" stroke-width="2" stroke-opacity="0.5"/>
      <!-- Sombra interior -->
      <rect x="2" y="2" width="196" height="396" rx="22" fill="none" stroke="#000" stroke-width="1" stroke-opacity="0.4"/>

      <!-- Notch -->
      <rect x="75" y="12" width="50" height="12" rx="6" fill="#000"/>
    </g>

    <!-- Etiqueta "MOCKUPS" -->
    <text x="240" y="570" text-anchor="middle" fill="#464749" font-family="monospace,monospace" font-size="9" font-weight="600" letter-spacing="3">REPRESENTATIVE MOCKUPS · NOT REAL CAPTURES</text>
  </g>

  <!-- Decoración: corner brackets -->
  <g stroke="#10B981" stroke-width="2" fill="none" stroke-opacity="0.6">
    <path d="M30 30 L30 60 M30 30 L60 30"/>
    <path d="M1170 30 L1170 60 M1170 30 L1140 30"/>
    <path d="M30 600 L30 570 M30 600 L60 600"/>
    <path d="M1170 600 L1170 570 M1170 600 L1140 600"/>
  </g>
</svg>

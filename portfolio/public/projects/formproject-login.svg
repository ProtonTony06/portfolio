<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="FormProject - Login admin">
  <title>FormProject - Login</title>
  <desc>Mockup de la página de acceso admin con tarjeta centrada y formulario de credenciales.</desc>

  <defs>
    <linearGradient id="bgFPLogin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgFPLogin)"/>

  <!-- Browser chrome -->
  <g>
    <rect x="20" y="20" width="1160" height="60" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="55" cy="50" r="7" fill="#EF4444"/>
    <circle cx="80" cy="50" r="7" fill="#FBBF24"/>
    <circle cx="105" cy="50" r="7" fill="#22C55E"/>
    <rect x="160" y="35" width="700" height="30" rx="15" fill="#F1F5F9"/>
    <text x="180" y="55" fill="#64748B" font-family="monospace,monospace" font-size="12">form.antoniocuevas.dev/admin/login</text>
  </g>

  <g transform="translate(20 80)">
    <!-- Public page body -->
    <rect x="0" y="0" width="1160" height="650" fill="url(#bgFPLogin)"/>

    <!-- Centered login card -->
    <g transform="translate(380 100)">
      <rect x="0" y="0" width="400" height="450" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

      <!-- Logo -->
      <g transform="translate(40 50)">
        <rect x="0" y="0" width="44" height="44" rx="10" fill="#0F172A"/>
        <path d="M12 16 L32 16 L27 11 L17 11 Z M12 24 L32 24 M12 32 L26 32" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="40" y="124" fill="#0F172A" font-family="Roboto, sans-serif" font-size="22" font-weight="700">FormProject</text>
      <text x="40" y="146" fill="#64748B" font-family="Roboto, sans-serif" font-size="13">Acceso administrador</text>

      <!-- Email field -->
      <g transform="translate(40 184)">
        <text x="0" y="0" fill="#475569" font-family="Roboto, sans-serif" font-size="12" font-weight="600">Email</text>
        <rect x="0" y="12" width="320" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="14" y="38" fill="#0F172A" font-family="Roboto, sans-serif" font-size="13">admin@antoniocuevas.dev</text>
      </g>

      <!-- Password field -->
      <g transform="translate(40 254)">
        <text x="0" y="0" fill="#475569" font-family="Roboto, sans-serif" font-size="12" font-weight="600">Contraseña</text>
        <rect x="0" y="12" width="320" height="40" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
        <g transform="translate(14 22)" fill="#0F172A">
          <circle cx="6" cy="10" r="5"/>
          <circle cx="22" cy="10" r="5"/>
          <circle cx="38" cy="10" r="5"/>
          <circle cx="54" cy="10" r="5"/>
          <circle cx="70" cy="10" r="5"/>
          <circle cx="86" cy="10" r="5"/>
        </g>
        <g transform="translate(280 22)" stroke="#94A3B8" stroke-width="1.5" fill="none">
          <path d="M0 4 C0 2 2 0 4 0 L12 0 C14 0 16 2 16 4 L16 12 C16 14 14 16 12 16 L4 16 C2 16 0 14 0 12 Z" />
          <circle cx="8" cy="8" r="2" fill="#94A3B8" stroke="none"/>
        </g>
      </g>

      <!-- Submit -->
      <g transform="translate(40 332)">
        <rect x="0" y="0" width="320" height="42" rx="8" fill="#0F172A"/>
        <text x="160" y="27" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="14" font-weight="600">Entrar</text>
      </g>

      <!-- Hint -->
      <text x="200" y="400" text-anchor="middle" fill="#94A3B8" font-family="Roboto, sans-serif" font-size="11">Protección con rate-limit por IP y por email.</text>
    </g>

    <!-- Decorative note -->
    <g transform="translate(80 130)">
      <rect x="0" y="0" width="220" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="20" y="32" fill="#94A3B8" font-family="monospace,monospace" font-size="10" letter-spacing="2">STACK</text>
      <text x="20" y="58" fill="#0F172A" font-family="Roboto, sans-serif" font-size="13" font-weight="600">NextAuth v5</text>
      <text x="20" y="76" fill="#64748B" font-family="Roboto, sans-serif" font-size="11">+ bcrypt + throttle</text>
    </g>
    <g transform="translate(900 130)">
      <rect x="0" y="0" width="220" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="20" y="32" fill="#94A3B8" font-family="monospace,monospace" font-size="10" letter-spacing="2">SESIÓN</text>
      <text x="20" y="58" fill="#0F172A" font-family="Roboto, sans-serif" font-size="13" font-weight="600">Cookie firmada</text>
      <text x="20" y="76" fill="#64748B" font-family="Roboto, sans-serif" font-size="11">Server-side only</text>
    </g>
  </g>

  <text x="600" y="730" text-anchor="middle" fill="#94A3B8" font-family="monospace,monospace" font-size="10" letter-spacing="3">MOCKUP · FORMPROJECT LOGIN</text>
</svg>

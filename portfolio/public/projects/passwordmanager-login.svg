<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" role="img" aria-label="PasswordManager - Login screen mockup">
  <title>PasswordManager Login</title>
  <desc>Mockup representativo de la pantalla de login con password maestro y biometría.</desc>

  <defs>
    <linearGradient id="bgDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1C1E"/>
      <stop offset="1" stop-color="#0F1012"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8849F5"/>
      <stop offset="1" stop-color="#5600B8"/>
    </linearGradient>
  </defs>

  <!-- Fondo Material 3 dark -->
  <rect width="360" height="720" fill="url(#bgDark)"/>

  <!-- Status bar -->
  <text x="24" y="30" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="12" font-weight="500">9:41</text>
  <g transform="translate(310 18)" fill="#E1E2E6">
    <rect x="0" y="6" width="3" height="6" rx="0.5"/>
    <rect x="5" y="4" width="3" height="8" rx="0.5"/>
    <rect x="10" y="2" width="3" height="10" rx="0.5"/>
    <rect x="15" y="0" width="3" height="12" rx="0.5"/>
  </g>
  <rect x="330" y="20" width="18" height="9" rx="2" fill="none" stroke="#E1E2E6" stroke-width="1"/>
  <rect x="332" y="22" width="12" height="5" fill="#E1E2E6"/>

  <!-- Container -->
  <g transform="translate(24 100)">
    <!-- Logo card (rounded extraLarge, 100dp) -->
    <rect x="106" y="0" width="100" height="100" rx="28" fill="url(#logoGrad)"/>
    <!-- Lock icon inside logo -->
    <g transform="translate(135 25)" fill="#EDE2FF">
      <path d="M11 0 C7 0 4 3 4 7 L4 14 L2 14 C1 14 0 15 0 16 L0 32 C0 33 1 34 2 34 L20 34 C21 34 22 33 22 32 L22 16 C22 15 21 14 20 14 L18 14 L18 7 C18 3 15 0 11 0 Z M7 7 C7 5 9 3 11 3 C13 3 15 5 15 7 L15 14 L7 14 Z" />
      <circle cx="11" cy="23" r="2.5"/>
    </g>

    <!-- Título -->
    <text x="156" y="148" text-anchor="middle" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="28" font-weight="700">PasswordManager</text>
    <!-- Subtítulo -->
    <text x="156" y="178" text-anchor="middle" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="16">Desbloquea tu bóveda</text>

    <!-- Password field (OutlinedTextField) -->
    <g transform="translate(0 230)">
      <rect x="0" y="0" width="312" height="56" rx="4" fill="none" stroke="#6F7073" stroke-width="1"/>
      <!-- Leading icon (Lock) -->
      <g transform="translate(16 20)" fill="#888A8D">
        <path d="M8 0 C6 0 4 1.5 4 3.5 L4 7 L2 7 C1 7 0 8 0 9 L0 16 C0 17 1 18 2 18 L14 18 C15 18 16 17 16 16 L16 9 C16 8 15 7 14 7 L12 7 L12 3.5 C12 1.5 10 0 8 0 Z M5 3.5 C5 2.5 6.5 1.5 8 1.5 C9.5 1.5 11 2.5 11 3.5 L11 7 L5 7 Z"/>
      </g>
      <!-- Password dots -->
      <g fill="#E1E2E6" transform="translate(48 26)">
        <circle cx="0" cy="4" r="3"/>
        <circle cx="10" cy="4" r="3"/>
        <circle cx="20" cy="4" r="3"/>
        <circle cx="30" cy="4" r="3"/>
        <circle cx="40" cy="4" r="3"/>
        <circle cx="50" cy="4" r="3"/>
        <circle cx="60" cy="4" r="3"/>
        <circle cx="70" cy="4" r="3"/>
      </g>
      <!-- Trailing icon (Visibility) -->
      <g transform="translate(280 22)" fill="#888A8D">
        <path d="M8 1 C4 1 1 4 0 8 C1 12 4 15 8 15 C12 15 15 12 16 8 C15 4 12 1 8 1 Z M8 4 C10 4 12 6 12 8 C12 10 10 12 8 12 C6 12 4 10 4 8 C4 6 6 4 8 4 Z M8 6 C7 6 6 7 6 8 C6 9 7 10 8 10 C9 10 10 9 10 8 C10 7 9 6 8 6 Z"/>
      </g>
    </g>

    <!-- Login button (filled, primary) -->
    <g transform="translate(0 310)">
      <rect x="0" y="0" width="312" height="56" rx="20" fill="#8849F5"/>
      <text x="156" y="35" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="16" font-weight="600">Iniciar Sesión</text>
    </g>

    <!-- Biometric button (outlined) -->
    <g transform="translate(0 382)">
      <rect x="0" y="0" width="312" height="56" rx="20" fill="none" stroke="#6F7073" stroke-width="1.5"/>
      <g transform="translate(120 18)" fill="#EDE2FF">
        <path d="M8 0 C5 0 3 2 3 5 L3 6 C2 7 1 8 1 10 L1 13 C1 14 2 15 3 15 L13 15 C14 15 15 14 15 13 L15 10 C15 8 14 7 13 6 L13 5 C13 2 11 0 8 0 Z M5 5 C5 3.5 6.5 2 8 2 C9.5 2 11 3.5 11 5 L11 6 L5 6 Z" />
        <path d="M3 17 L13 17 L13 19 C13 19.5 12.5 20 12 20 L4 20 C3.5 20 3 19.5 3 19 Z"/>
      </g>
      <text x="170" y="35" fill="#EDE2FF" font-family="Roboto, sans-serif" font-size="16" font-weight="500">Usar Biometría</text>
    </g>

    <!-- Divider -->
    <line x1="0" y1="470" x2="312" y2="470" stroke="#464749" stroke-width="1"/>

    <!-- Warning card -->
    <g transform="translate(0 494)">
      <rect x="0" y="0" width="312" height="100" rx="12" fill="#2F3133"/>
      <g transform="translate(16 16)" fill="#FFB4AB">
        <circle cx="12" cy="12" r="10" fill="none" stroke="#FFB4AB" stroke-width="2"/>
        <rect x="11" y="6" width="2" height="8" fill="#FFB4AB"/>
        <circle cx="12" cy="17" r="1.2" fill="#FFB4AB"/>
      </g>
      <text x="56" y="32" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="14" font-weight="600">¿Olvidaste tu contraseña?</text>
      <text x="16" y="60" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="12">Por seguridad, NO hay recuperación de password.</text>
      <text x="16" y="78" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="12">Al ser 100% local, solo tú tienes acceso. Si olvidas</text>
      <text x="16" y="94" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="12">el password, deberás reinstalar la app.</text>
    </g>
  </g>

  <!-- Subtle footer label -->
  <text x="180" y="690" text-anchor="middle" fill="#464749" font-family="monospace" font-size="10">MOCKUP · MATERIAL 3 · DARK</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="FormProject - Portada del proyecto">
  <title>FormProject - Portada</title>
  <desc>Portada representativa del proyecto FormProject con branding y mockups del builder y formulario público.</desc>

  <defs>
    <linearGradient id="bgCoverFP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1F1A"/>
      <stop offset="1" stop-color="#030706"/>
    </linearGradient>

    <linearGradient id="logoCoverFP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#00770D"/>
    </linearGradient>

    <radialGradient id="logoGlowFP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gridPatternFP" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.05"/>
    </pattern>

    <!-- Mini builder (admin) -->
    <symbol id="miniBuilder" viewBox="0 0 600 380">
      <rect width="600" height="380" fill="#F8FAFC"/>
      <!-- Browser chrome -->
      <rect x="0" y="0" width="600" height="32" fill="#E2E8F0"/>
      <circle cx="20" cy="16" r="5" fill="#EF4444"/>
      <circle cx="38" cy="16" r="5" fill="#FBBF24"/>
      <circle cx="56" cy="16" r="5" fill="#22C55E"/>
      <!-- Header -->
      <rect x="0" y="32" width="600" height="44" fill="#FFFFFF" stroke="#E2E8F0"/>
      <g transform="translate(20 46)">
        <rect x="0" y="0" width="20" height="20" rx="4" fill="#0F172A"/>
        <path d="M5 7 L10 12 L15 7 M5 13 L10 18 L15 13" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="50" y="60" fill="#0F172A" font-family="Roboto, sans-serif" font-size="13" font-weight="700">FormProject</text>
      <rect x="510" y="44" width="70" height="22" rx="11" fill="#0F172A"/>
      <text x="545" y="59" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="10" font-weight="600">Guardar</text>
      <!-- Body -->
      <rect x="0" y="76" width="600" height="304" fill="#F8FAFC"/>
      <!-- Form meta -->
      <g transform="translate(20 96)">
        <text x="0" y="0" fill="#0F172A" font-family="Roboto, sans-serif" font-size="14" font-weight="700">Encuesta de satisfacción</text>
        <text x="0" y="18" fill="#64748B" font-family="Roboto, sans-serif" font-size="9">Recoge feedback sobre el servicio · 3 preguntas</text>
      </g>
      <!-- Question rows -->
      <g transform="translate(20 140)">
        <rect x="0" y="0" width="560" height="44" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="14" y="20" fill="#94A3B8" font-family="monospace,monospace" font-size="9">⋮⋮</text>
        <text x="38" y="20" fill="#0F172A" font-family="Roboto, sans-serif" font-size="11" font-weight="600">¿Cómo valorarías el servicio?</text>
        <text x="38" y="34" fill="#64748B" font-family="Roboto, sans-serif" font-size="9">Opción múltiple · requerido</text>
        <rect x="490" y="14" width="56" height="18" rx="9" fill="#10B981"/>
        <text x="518" y="27" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="9" font-weight="600">Activo</text>
      </g>
      <g transform="translate(20 192)">
        <rect x="0" y="0" width="560" height="44" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="14" y="20" fill="#94A3B8" font-family="monospace,monospace" font-size="9">⋮⋮</text>
        <text x="38" y="20" fill="#0F172A" font-family="Roboto, sans-serif" font-size="11" font-weight="600">¿Qué echas en falta?</text>
        <text x="38" y="34" fill="#64748B" font-family="Roboto, sans-serif" font-size="9">Texto libre · opcional</text>
        <rect x="490" y="14" width="56" height="18" rx="9" fill="#CBD5E1"/>
        <text x="518" y="27" text-anchor="middle" fill="#475569" font-family="Roboto, sans-serif" font-size="9" font-weight="600">Inactivo</text>
      </g>
      <g transform="translate(20 244)">
        <rect x="0" y="0" width="560" height="44" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="14" y="20" fill="#94A3B8" font-family="monospace,monospace" font-size="9">⋮⋮</text>
        <text x="38" y="20" fill="#0F172A" font-family="Roboto, sans-serif" font-size="11" font-weight="600">¿Recomendarías el servicio?</text>
        <text x="38" y="34" fill="#64748B" font-family="Roboto, sans-serif" font-size="9">Opción múltiple · requerido</text>
        <rect x="490" y="14" width="56" height="18" rx="9" fill="#10B981"/>
        <text x="518" y="27" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="9" font-weight="600">Activo</text>
      </g>
      <!-- Add button -->
      <g transform="translate(20 300)">
        <rect x="0" y="0" width="560" height="36" rx="6" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 3"/>
        <text x="280" y="22" text-anchor="middle" fill="#64748B" font-family="Roboto, sans-serif" font-size="11" font-weight="600">+ Añadir pregunta</text>
      </g>
    </symbol>

    <!-- Mini public form -->
    <symbol id="miniPublicForm" viewBox="0 0 600 380">
      <rect width="600" height="380" fill="#F8FAFC"/>
      <!-- Browser chrome -->
      <rect x="0" y="0" width="600" height="32" fill="#E2E8F0"/>
      <circle cx="20" cy="16" r="5" fill="#EF4444"/>
      <circle cx="38" cy="16" r="5" fill="#FBBF24"/>
      <circle cx="56" cy="16" r="5" fill="#22C55E"/>
      <text x="80" y="20" fill="#64748B" font-family="monospace,monospace" font-size="9">form.antoniocuevas.dev/f/encuesta-demo</text>
      <!-- Centered card -->
      <g transform="translate(80 56)">
        <rect x="0" y="0" width="440" height="300" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="24" y="40" fill="#0F172A" font-family="Roboto, sans-serif" font-size="18" font-weight="700">Encuesta de satisfacción</text>
        <text x="24" y="62" fill="#64748B" font-family="Roboto, sans-serif" font-size="10">Tu opinión nos ayuda a mejorar el servicio.</text>
        <!-- Question 1: option multiple -->
        <text x="24" y="96" fill="#0F172A" font-family="Roboto, sans-serif" font-size="11" font-weight="600">¿Cómo valorarías el servicio?</text>
        <text x="24" y="108" fill="#EF4444" font-family="Roboto, sans-serif" font-size="9">*</text>
        <g transform="translate(24 118)">
          <circle cx="6" cy="6" r="5" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
          <text x="20" y="10" fill="#0F172A" font-family="Roboto, sans-serif" font-size="10">Excelente</text>
        </g>
        <g transform="translate(24 138)">
          <circle cx="6" cy="6" r="5" fill="#10B981" stroke="#10B981" stroke-width="3"/>
          <text x="20" y="10" fill="#0F172A" font-family="Roboto, sans-serif" font-size="10">Bueno</text>
        </g>
        <g transform="translate(24 158)">
          <circle cx="6" cy="6" r="5" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
          <text x="20" y="10" fill="#0F172A" font-family="Roboto, sans-serif" font-size="10">Regular</text>
        </g>
        <!-- Question 2: text -->
        <text x="24" y="200" fill="#0F172A" font-family="Roboto, sans-serif" font-size="11" font-weight="600">¿Qué echas en falta?</text>
        <rect x="24" y="210" width="392" height="48" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
        <text x="34" y="230" fill="#94A3B8" font-family="Roboto, sans-serif" font-size="9">Escribe tu respuesta...</text>
        <!-- Submit -->
        <rect x="24" y="270" width="120" height="22" rx="6" fill="#0F172A"/>
        <text x="84" y="285" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="10" font-weight="600">Enviar respuesta</text>
      </g>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgCoverFP)"/>
  <rect width="1200" height="630" fill="url(#gridPatternFP)"/>

  <!-- Glow ambient -->
  <circle cx="280" cy="315" r="280" fill="url(#logoGlowFP)"/>

  <!-- Branding izquierdo -->
  <g transform="translate(60 100)">
    <!-- Tag -->
    <g>
      <rect x="0" y="0" width="240" height="32" rx="16" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5"/>
      <circle cx="22" cy="16" r="4" fill="#10B981"/>
      <text x="38" y="21" fill="#10B981" font-family="monospace,monospace" font-size="11" font-weight="600" letter-spacing="2">NEXT.JS · FULL-STACK · MVP</text>
    </g>

    <!-- Título -->
    <text x="0" y="100" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">FormProject</text>

    <!-- Subtítulo -->
    <text x="0" y="148" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="18" font-weight="400">Crea y comparte formularios dinámicos</text>

    <!-- Descripción -->
    <text x="0" y="210" fill="#888A8D" font-family="Roboto, sans-serif" font-size="15" font-weight="400">Plataforma de formularios personalizables</text>
    <text x="0" y="232" fill="#888A8D" font-family="Roboto, sans-serif" font-size="15" font-weight="400">con Supabase, NextAuth y validación Zod.</text>

    <!-- Tech badges -->
    <g transform="translate(0 280)">
      <g>
        <rect x="0" y="0" width="76" height="32" rx="8" fill="#1A1C1E" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
        <text x="38" y="21" text-anchor="middle" fill="#5CE55A" font-family="monospace,monospace" font-size="12" font-weight="500">Next.js</text>
      </g>
      <g transform="translate(86 0)">
        <rect x="0" y="0" width="86" height="32" rx="8" fill="#1A1C1E" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
        <text x="43" y="21" text-anchor="middle" fill="#5CE55A" font-family="monospace,monospace" font-size="12" font-weight="500">Supabase</text>
      </g>
      <g transform="translate(182 0)">
        <rect x="0" y="0" width="98" height="32" rx="8" fill="#1A1C1E" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
        <text x="49" y="21" text-anchor="middle" fill="#5CE55A" font-family="monospace,monospace" font-size="12" font-weight="500">NextAuth</text>
      </g>
      <g transform="translate(290 0)">
        <rect x="0" y="0" width="48" height="32" rx="8" fill="#1A1C1E" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
        <text x="24" y="21" text-anchor="middle" fill="#5CE55A" font-family="monospace,monospace" font-size="12" font-weight="500">Zod</text>
      </g>
    </g>

    <!-- Año -->
    <text x="0" y="380" fill="#464749" font-family="monospace,monospace" font-size="14" font-weight="500" letter-spacing="2">2026 · MVP · INSTITUTO</text>
  </g>

  <!-- Showcase derecho: 2 mini screenshots apilados -->
  <g transform="translate(660 50)">
    <!-- Builder (atrás, ligeramente rotada) -->
    <g transform="translate(40 30) rotate(4 250 175)">
      <rect x="0" y="0" width="500" height="320" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1" stroke-opacity="0.2" opacity="0.92"/>
      <use href="#miniBuilder" width="500" height="320" rx="10"/>
    </g>

    <!-- Public form (delante) -->
    <g transform="translate(0 110)">
      <rect x="0" y="0" width="500" height="320" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2" stroke-opacity="0.5"/>
      <use href="#miniPublicForm" width="500" height="320" rx="10"/>
      <!-- Sombra interior -->
      <rect x="2" y="2" width="496" height="316" rx="8" fill="none" stroke="#000" stroke-width="1" stroke-opacity="0.3"/>
    </g>

    <!-- Etiqueta "MOCKUPS" -->
    <text x="250" y="510" text-anchor="middle" fill="#464749" font-family="monospace,monospace" font-size="9" font-weight="600" letter-spacing="3">REPRESENTATIVE MOCKUPS · NOT REAL CAPTURES</text>
  </g>

  <!-- Corner brackets -->
  <g stroke="#10B981" stroke-width="2" fill="none" stroke-opacity="0.6">
    <path d="M30 30 L30 60 M30 30 L60 30"/>
    <path d="M1170 30 L1170 60 M1170 30 L1140 30"/>
    <path d="M30 600 L30 570 M30 600 L60 600"/>
    <path d="M1170 600 L1170 570 M1170 600 L1140 600"/>
  </g>
</svg>

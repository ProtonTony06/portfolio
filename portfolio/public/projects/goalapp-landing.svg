<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="GoalApp - Landing pública">
  <title>GoalApp - Landing pública</title>
  <desc>Mockup de la página de aterrizaje pública con hero, features y CTA.</desc>

  <defs>
    <linearGradient id="bgGoalHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18181B"/>
      <stop offset="1" stop-color="#3F3F46"/>
    </linearGradient>
    <linearGradient id="ctaGoal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BEF264"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Fondo base -->
  <rect width="1200" height="750" fill="#09090B"/>

  <!-- Browser chrome -->
  <g>
    <rect x="20" y="20" width="1160" height="60" rx="12" fill="#27272A"/>
    <circle cx="55" cy="50" r="7" fill="#EF4444"/>
    <circle cx="80" cy="50" r="7" fill="#FBBF24"/>
    <circle cx="105" cy="50" r="7" fill="#22C55E"/>
    <rect x="160" y="35" width="700" height="30" rx="15" fill="#18181B"/>
    <text x="180" y="55" fill="#71717A" font-family="monospace,monospace" font-size="12">https://goalapp-frontend-web.onrender.com</text>
  </g>

  <!-- Página web -->
  <g transform="translate(20 80)">
    <!-- Header -->
    <rect x="0" y="0" width="1160" height="60" fill="#18181B"/>
    <g transform="translate(40 30)">
      <circle cx="0" cy="0" r="14" fill="#BEF264"/>
      <path d="M-6 -4 C-6 -7 -3 -9 0 -9 C3 -9 6 -7 6 -4 L6 0 L7 0 C8 0 8 1 8 2 L8 8 C8 9 8 10 7 10 L-7 10 C-8 10 -8 9 -8 8 L-8 2 C-8 1 -8 0 -7 0 L-6 0 Z" fill="#18181B"/>
    </g>
    <text x="76" y="36" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="18" font-weight="700">GoalApp</text>
    <g transform="translate(900 22)">
      <text x="0" y="16" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="13">Ligas</text>
      <text x="80" y="16" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="13">Equipos</text>
      <text x="180" y="16" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="13">Calendario</text>
    </g>
    <rect x="1040" y="14" width="80" height="32" rx="8" fill="#BEF264"/>
    <text x="1080" y="34" text-anchor="middle" fill="#18181B" font-family="Roboto, sans-serif" font-size="12" font-weight="600">Login</text>

    <!-- Hero -->
    <rect x="0" y="60" width="1160" height="380" fill="url(#bgGoalHero)"/>
    <!-- Badge -->
    <g transform="translate(460 110)">
      <rect x="0" y="0" width="240" height="32" rx="16" fill="#3F3F46" stroke="#BEF264" stroke-width="1"/>
      <path d="M14 8 L20 16 L26 6 M20 16 L20 22 L26 16" stroke="#BEF264" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="50" y="20" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="12">La mejor plataforma de gestión deportiva</text>
    </g>
    <!-- Title -->
    <text x="580" y="220" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="42" font-weight="800">Gestiona tu Liga Deportiva de</text>
    <text x="580" y="270" text-anchor="middle" fill="#BEF264" font-family="Roboto, sans-serif" font-size="42" font-weight="800">forma Profesional</text>
    <!-- Description -->
    <text x="580" y="320" text-anchor="middle" fill="#71717A" font-family="Roboto, sans-serif" font-size="14">Una plataforma completa para organizar ligas, gestionar equipos</text>
    <text x="580" y="338" text-anchor="middle" fill="#71717A" font-family="Roboto, sans-serif" font-size="14">seguir resultados y mantener actualizados los rankings en tiempo real.</text>
    <!-- CTAs -->
    <g transform="translate(450 370)">
      <rect x="0" y="0" width="160" height="44" rx="12" fill="#BEF264"/>
      <text x="80" y="28" text-anchor="middle" fill="#18181B" font-family="Roboto, sans-serif" font-size="14" font-weight="700">Comenzar Ahora →</text>
      <rect x="180" y="0" width="120" height="44" rx="12" fill="none" stroke="#A1A1AA" stroke-width="1"/>
      <text x="240" y="28" text-anchor="middle" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="14" font-weight="600">Iniciar Sesión</text>
    </g>

    <!-- Features -->
    <rect x="0" y="440" width="1160" height="200" fill="#18181B"/>
    <text x="580" y="475" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="20" font-weight="600">Todo lo que necesitas</text>
    <text x="580" y="500" text-anchor="middle" fill="#71717A" font-family="Roboto, sans-serif" font-size="12">Herramientas profesionales para gestionar cada aspecto de tu liga deportiva</text>

    <g transform="translate(40 520)">
      <!-- Feature 1 -->
      <rect x="0" y="0" width="260" height="100" rx="8" fill="#27272A"/>
      <rect x="105" y="14" width="48" height="48" rx="10" fill="#BEF264"/>
      <path d="M120 30 C120 28 122 26 124 26 L154 26 C156 26 158 28 158 30 L158 50 C158 52 156 54 154 54 L124 54 C122 54 120 52 120 50 Z M120 32 L158 32 L158 38 L120 38 Z M120 42 L158 42 L158 54 L120 54 Z" fill="#18181B"/>
      <text x="130" y="78" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="13" font-weight="600">Gestión de Ligas</text>
      <text x="130" y="92" text-anchor="middle" fill="#71717A" font-family="Roboto, sans-serif" font-size="11">Múltiples ligas en una plataforma</text>
    </g>

    <g transform="translate(310 520)">
      <!-- Feature 2 -->
      <rect x="0" y="0" width="260" height="100" rx="8" fill="#27272A"/>
      <rect x="105" y="14" width="48" height="48" rx="10" fill="#BEF264"/>
      <circle cx="129" cy="38" r="11" fill="none" stroke="#18181B" stroke-width="2"/>
      <path d="M117 38 L127 48 L141 32" stroke="#18181B" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="130" y="78" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="13" font-weight="600">Equipos &amp; Jugadores</text>
      <text x="130" y="92" text-anchor="middle" fill="#71717A" font-family="Roboto, sans-serif" font-size="11">Control en tiempo real</text>
    </g>

    <g transform="translate(580 520)">
      <!-- Feature 3 -->
      <rect x="0" y="0" width="260" height="100" rx="8" fill="#27272A"/>
      <rect x="105" y="14" width="48" height="48" rx="10" fill="#BEF264"/>
      <rect x="115" y="24" width="40" height="32" rx="3" fill="none" stroke="#18181B" stroke-width="2"/>
      <line x1="115" y1="32" x2="155" y2="32" stroke="#18181B" stroke-width="2"/>
      <line x1="125" y1="22" x2="125" y2="28" stroke="#18181B" stroke-width="2" stroke-linecap="round"/>
      <line x1="145" y1="22" x2="145" y2="28" stroke="#18181B" stroke-width="2" stroke-linecap="round"/>
      <text x="130" y="78" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="13" font-weight="600">Calendario Inteligente</text>
      <text x="130" y="92" text-anchor="middle" fill="#71717A" font-family="Roboto, sans-serif" font-size="11">Programación automatizada</text>
    </g>

    <g transform="translate(850 520)">
      <!-- Feature 4 -->
      <rect x="0" y="0" width="260" height="100" rx="8" fill="#27272A"/>
      <rect x="105" y="14" width="48" height="48" rx="10" fill="#BEF264"/>
      <rect x="115" y="44" width="10" height="14" fill="#18181B"/>
      <rect x="127" y="34" width="10" height="24" fill="#18181B"/>
      <rect x="139" y="28" width="10" height="30" fill="#18181B"/>
      <text x="130" y="78" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="13" font-weight="600">Rankings Actualizados</text>
      <text x="130" y="92" text-anchor="middle" fill="#71717A" font-family="Roboto, sans-serif" font-size="11">Clasificaciones en vivo</text>
    </g>
  </g>

  <text x="600" y="730" text-anchor="middle" fill="#3F3F46" font-family="monospace,monospace" font-size="10" letter-spacing="3">MOCKUP · GOALAPP LANDING · TAILWIND ZINC+LIME</text>
</svg>

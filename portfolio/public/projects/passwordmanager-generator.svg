<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" role="img" aria-label="PasswordManager - Password generator screen mockup">
  <title>PasswordManager Generador</title>
  <desc>Mockup del generador de contraseñas con slider de longitud, switches y medidor de fortaleza.</desc>

  <defs>
    <linearGradient id="bgDark3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1C1E"/>
      <stop offset="1" stop-color="#0F1012"/>
    </linearGradient>
  </defs>

  <rect width="360" height="720" fill="url(#bgDark3)"/>

  <!-- Status bar -->
  <text x="24" y="30" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="12" font-weight="500">9:41</text>
  <g transform="translate(310 18)" fill="#E1E2E6">
    <rect x="0" y="6" width="3" height="6" rx="0.5"/>
    <rect x="5" y="4" width="3" height="8" rx="0.5"/>
    <rect x="10" y="2" width="3" height="10" rx="0.5"/>
    <rect x="15" y="0" width="3" height="12" rx="0.5"/>
  </g>

  <!-- TopAppBar with back -->
  <g transform="translate(0 50)">
    <rect x="0" y="0" width="360" height="64" fill="#1A1C1E"/>
    <g transform="translate(16 22)" fill="#BFC2C6">
      <path d="M16 0 L14 2 L8 8 L14 14 L16 16 L6 8 Z" transform="translate(0 0)"/>
    </g>
    <text x="156" y="38" text-anchor="middle" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="18" font-weight="600">Generar Contraseña</text>
  </g>

  <!-- Password preview card -->
  <g transform="translate(24 138)">
    <rect x="0" y="0" width="312" height="180" rx="16" fill="#2F3133"/>
    <text x="156" y="44" text-anchor="middle" fill="#E1E2E6" font-family="monospace,monospace" font-size="20" font-weight="600">K9#mP2$vL8nQ4</text>

    <!-- Strength bars (3/3 verde - Fuerte) -->
    <g transform="translate(86 64)">
      <rect x="0" y="0" width="40" height="6" rx="3" fill="#5CE55A"/>
      <rect x="46" y="0" width="40" height="6" rx="3" fill="#5CE55A"/>
      <rect x="92" y="0" width="40" height="6" rx="3" fill="#5CE55A"/>
    </g>
    <text x="156" y="92" text-anchor="middle" fill="#5CE55A" font-family="Roboto, sans-serif" font-size="12">Fuerte</text>

    <!-- Action buttons -->
    <g transform="translate(16 112)">
      <rect x="0" y="0" width="135" height="48" rx="20" fill="#8849F5"/>
      <g transform="translate(20 14)" fill="#FFFFFF">
        <path d="M10 1 C4 1 0 6 0 11 C0 16 4 21 10 21 C16 21 20 16 20 11 C20 6 16 1 10 1 Z M10 4 C14 4 17 7 17 11 C17 15 14 18 10 18 C6 18 3 15 3 11 C3 7 6 4 10 4 Z M11 6 L11 8 L13 8 L13 10 L11 10 L11 13 L9 13 L9 10 L7 10 L7 8 L9 8 L9 6 Z"/>
      </g>
      <text x="78" y="30" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="15" font-weight="500">Generar</text>
    </g>
    <g transform="translate(161 112)">
      <rect x="0" y="0" width="135" height="48" rx="20" fill="#8849F5"/>
      <g transform="translate(20 14)" fill="#FFFFFF">
        <rect x="0" y="3" width="14" height="16" rx="1" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
        <rect x="6" y="0" width="14" height="16" rx="1" fill="#8849F5" stroke="#FFFFFF" stroke-width="1.5"/>
      </g>
      <text x="78" y="30" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="15" font-weight="500">Copiar</text>
    </g>
  </g>

  <!-- Length slider -->
  <g transform="translate(24 342)">
    <text x="0" y="0" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="16" font-weight="500">Longitud</text>
    <text x="312" y="0" text-anchor="end" fill="#8849F5" font-family="monospace,monospace" font-size="16" font-weight="600">20</text>

    <!-- Slider track -->
    <rect x="0" y="20" width="312" height="4" rx="2" fill="#464749"/>
    <rect x="0" y="20" width="187" height="4" rx="2" fill="#8849F5"/>
    <!-- Thumb -->
    <circle cx="187" cy="22" r="10" fill="#8849F5"/>

    <text x="0" y="50" fill="#888A8D" font-family="Roboto, sans-serif" font-size="11">8</text>
    <text x="312" y="50" text-anchor="end" fill="#888A8D" font-family="Roboto, sans-serif" font-size="11">64</text>
  </g>

  <!-- Character options -->
  <g transform="translate(24 420)">
    <text x="0" y="0" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="16" font-weight="500">Tipos de caracteres</text>

    <!-- Mayúsculas -->
    <g transform="translate(0 24)">
      <text x="0" y="14" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="15">Mayúsculas (A-Z)</text>
      <text x="0" y="32" fill="#888A8D" font-family="monospace,monospace" font-size="11">ABCDEFGHIJKLMNOPQRSTUVWXYZ</text>
      <!-- Switch ON -->
      <rect x="252" y="6" width="48" height="24" rx="12" fill="#8849F5"/>
      <circle cx="290" cy="18" r="9" fill="#FFFFFF"/>
    </g>

    <!-- Minúsculas -->
    <g transform="translate(0 76)">
      <text x="0" y="14" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="15">Minúsculas (a-z)</text>
      <text x="0" y="32" fill="#888A8D" font-family="monospace,monospace" font-size="11">abcdefghijklmnopqrstuvwxyz</text>
      <rect x="252" y="6" width="48" height="24" rx="12" fill="#8849F5"/>
      <circle cx="290" cy="18" r="9" fill="#FFFFFF"/>
    </g>

    <!-- Números -->
    <g transform="translate(0 128)">
      <text x="0" y="14" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="15">Números (0-9)</text>
      <text x="0" y="32" fill="#888A8D" font-family="monospace,monospace" font-size="11">0123456789</text>
      <rect x="252" y="6" width="48" height="24" rx="12" fill="#8849F5"/>
      <circle cx="290" cy="18" r="9" fill="#FFFFFF"/>
    </g>

    <!-- Símbolos -->
    <g transform="translate(0 180)">
      <text x="0" y="14" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="15">Símbolos</text>
      <text x="0" y="32" fill="#888A8D" font-family="monospace,monospace" font-size="11">!@#$%^&amp;*()_+-=[]{}|;:,.&lt;&gt;?</text>
      <rect x="252" y="6" width="48" height="24" rx="12" fill="#8849F5"/>
      <circle cx="290" cy="18" r="9" fill="#FFFFFF"/>
    </g>

    <!-- Divider -->
    <line x1="0" y1="234" x2="312" y2="234" stroke="#464749" stroke-width="1"/>

    <!-- Excluir ambiguos -->
    <g transform="translate(0 254)">
      <text x="0" y="14" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="15">Excluir caracteres ambiguos</text>
      <text x="0" y="32" fill="#888A8D" font-family="monospace,monospace" font-size="11">Evitar: l, 1, I, O, 0</text>
      <!-- Switch OFF -->
      <rect x="252" y="6" width="48" height="24" rx="12" fill="#464749"/>
      <circle cx="262" cy="18" r="9" fill="#BFC2C6"/>
    </g>
  </g>

  <text x="180" y="704" text-anchor="middle" fill="#464749" font-family="monospace" font-size="10">MOCKUP · MATERIAL 3 · DARK</text>
</svg>

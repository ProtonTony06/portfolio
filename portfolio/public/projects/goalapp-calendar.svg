<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="GoalApp - Calendario de jornadas">
  <title>GoalApp - Calendario</title>
  <desc>Mockup del calendario por jornadas con cards de partidos y próximos encuentros.</desc>

  <defs>
    <linearGradient id="bgGoalCal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18181B"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="#09090B"/>

  <!-- Browser chrome -->
  <g>
    <rect x="20" y="20" width="1160" height="60" rx="12" fill="#27272A"/>
    <circle cx="55" cy="50" r="7" fill="#EF4444"/>
    <circle cx="80" cy="50" r="7" fill="#FBBF24"/>
    <circle cx="105" cy="50" r="7" fill="#22C55E"/>
    <rect x="160" y="35" width="700" height="30" rx="15" fill="#18181B"/>
    <text x="180" y="55" fill="#71717A" font-family="monospace,monospace" font-size="12">https://goalapp-frontend-web.onrender.com/calendar</text>
  </g>

  <g transform="translate(20 80)">
    <!-- Nav -->
    <rect x="0" y="0" width="1160" height="50" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    <text x="30" y="32" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="14" font-weight="600">GoalApp</text>
    <g transform="translate(180 18)" fill="#A1A1AA">
      <text x="0" y="14" font-family="Roboto, sans-serif" font-size="12">Liga Élite ▾</text>
    </g>
    <g transform="translate(900 18)" fill="#A1A1AA">
      <text x="0" y="14" font-family="Roboto, sans-serif" font-size="12">Dashboard</text>
      <text x="80" y="14" fill="#BEF264" font-family="Roboto, sans-serif" font-size="12" font-weight="600">Calendario</text>
      <text x="170" y="14" font-family="Roboto, sans-serif" font-size="12">Equipos</text>
    </g>
    <circle cx="1100" cy="25" r="14" fill="#BEF264"/>
    <text x="1100" y="30" text-anchor="middle" fill="#18181B" font-family="Roboto, sans-serif" font-size="13" font-weight="700">AC</text>

    <!-- Body -->
    <rect x="0" y="50" width="1160" height="620" fill="url(#bgGoalCal)"/>

    <!-- Header -->
    <text x="40" y="100" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="28" font-weight="700">Calendario</text>
    <text x="40" y="124" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="13">Gestiona todos los encuentros de la liga</text>

    <!-- Stats row -->
    <g transform="translate(40 160)">
      <rect x="0" y="0" width="170" height="80" rx="10" fill="#27272A"/>
      <text x="20" y="28" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="10" letter-spacing="2">JORNADAS</text>
      <text x="20" y="62" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="28" font-weight="700">10</text>
    </g>
    <g transform="translate(225 160)">
      <rect x="0" y="0" width="170" height="80" rx="10" fill="#27272A"/>
      <text x="20" y="28" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="10" letter-spacing="2">PARTIDOS</text>
      <text x="20" y="62" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="28" font-weight="700">56</text>
    </g>
    <g transform="translate(410 160)">
      <rect x="0" y="0" width="170" height="80" rx="10" fill="#27272A"/>
      <text x="20" y="28" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="10" letter-spacing="2">PRÓXIMOS</text>
      <text x="20" y="62" fill="#BEF264" font-family="Roboto, sans-serif" font-size="28" font-weight="700">3</text>
    </g>
    <g transform="translate(595 160)">
      <rect x="0" y="0" width="170" height="80" rx="10" fill="#27272A"/>
      <text x="20" y="28" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="10" letter-spacing="2">EN VIVO</text>
      <text x="20" y="62" fill="#EF4444" font-family="Roboto, sans-serif" font-size="28" font-weight="700">2</text>
      <circle cx="100" cy="56" r="4" fill="#EF4444"/>
    </g>
    <g transform="translate(780 160)">
      <rect x="0" y="0" width="170" height="80" rx="10" fill="#27272A"/>
      <text x="20" y="28" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="10" letter-spacing="2">HOY</text>
      <text x="20" y="62" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="28" font-weight="700">2</text>
    </g>
    <g transform="translate(965 160)">
      <rect x="0" y="0" width="155" height="80" rx="10" fill="#27272A"/>
      <text x="20" y="28" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="10" letter-spacing="2">MAÑANA</text>
      <text x="20" y="62" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="28" font-weight="700">1</text>
    </g>

    <!-- Jornada 11 header -->
    <g transform="translate(40 280)">
      <rect x="0" y="0" width="1080" height="40" rx="8" fill="#27272A"/>
      <circle cx="20" cy="20" r="6" fill="#BEF264"/>
      <text x="40" y="26" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="14" font-weight="600">Jornada 11</text>
      <text x="160" y="26" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="12">3 partidos · 12-14 Mayo 2026</text>
      <text x="1040" y="26" text-anchor="end" fill="#BEF264" font-family="Roboto, sans-serif" font-size="12">+ Expandir</text>
    </g>

    <!-- Match cards row -->
    <g transform="translate(40 340)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="350" height="120" rx="10" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
      <rect x="14" y="14" width="60" height="20" rx="4" fill="#3F3F46"/>
      <text x="44" y="28" text-anchor="middle" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="10" letter-spacing="1">J11</text>
      <text x="320" y="28" text-anchor="end" fill="#BEF264" font-family="Roboto, sans-serif" font-size="11" font-weight="600">12 MAY · 20:00</text>
      <circle cx="24" cy="60" r="11" fill="#A21CAF"/>
      <text x="44" y="64" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="14" font-weight="500">FC Barcelona</text>
      <circle cx="24" cy="90" r="11" fill="#FFFFFF"/>
      <text x="44" y="94" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="14" font-weight="500">Real Madrid</text>
      <text x="320" y="78" text-anchor="end" fill="#71717A" font-family="Roboto, sans-serif" font-size="11">Programado</text>
      <line x1="14" y1="105" x2="336" y2="105" stroke="#3F3F46" stroke-width="1"/>
    </g>

    <g transform="translate(405 340)">
      <rect x="0" y="0" width="350" height="120" rx="10" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
      <rect x="14" y="14" width="60" height="20" rx="4" fill="#3F3F46"/>
      <text x="44" y="28" text-anchor="middle" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="10" letter-spacing="1">J11</text>
      <text x="320" y="28" text-anchor="end" fill="#BEF264" font-family="Roboto, sans-serif" font-size="11" font-weight="600">13 MAY · 18:30</text>
      <circle cx="24" cy="60" r="11" fill="#3B82F6"/>
      <text x="44" y="64" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="14" font-weight="500">Real Oviedo</text>
      <circle cx="24" cy="90" r="11" fill="#22C55E"/>
      <text x="44" y="94" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="14" font-weight="500">Sporting Gijón</text>
      <text x="320" y="78" text-anchor="end" fill="#71717A" font-family="Roboto, sans-serif" font-size="11">Programado</text>
      <line x1="14" y1="105" x2="336" y2="105" stroke="#3F3F46" stroke-width="1"/>
    </g>

    <g transform="translate(770 340)">
      <rect x="0" y="0" width="350" height="120" rx="10" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
      <rect x="14" y="14" width="60" height="20" rx="4" fill="#3F3F46"/>
      <text x="44" y="28" text-anchor="middle" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="10" letter-spacing="1">J11</text>
      <text x="320" y="28" text-anchor="end" fill="#BEF264" font-family="Roboto, sans-serif" font-size="11" font-weight="600">14 MAY · 21:00</text>
      <circle cx="24" cy="60" r="11" fill="#EF4444"/>
      <text x="44" y="64" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="14" font-weight="500">Sevilla FC</text>
      <circle cx="24" cy="90" r="11" fill="#BEF264"/>
      <text x="44" y="94" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="14" font-weight="500">Atlético Madrid</text>
      <text x="320" y="78" text-anchor="end" fill="#71717A" font-family="Roboto, sans-serif" font-size="11">Programado</text>
      <line x1="14" y1="105" x2="336" y2="105" stroke="#3F3F46" stroke-width="1"/>
    </g>

    <!-- Jornada 10 (finalizada) -->
    <g transform="translate(40 480)">
      <rect x="0" y="0" width="1080" height="40" rx="8" fill="#27272A"/>
      <circle cx="20" cy="20" r="6" fill="#71717A"/>
      <text x="40" y="26" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="14" font-weight="600">Jornada 10</text>
      <text x="160" y="26" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="12">3 partidos finalizados · 5-7 Mayo 2026</text>
      <text x="1040" y="26" text-anchor="end" fill="#A1A1AA" font-family="Roboto, sans-serif" font-size="12">− Contraer</text>
    </g>

    <g transform="translate(40 540)">
      <!-- Finished match -->
      <rect x="0" y="0" width="350" height="100" rx="10" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
      <text x="20" y="24" fill="#71717A" font-family="Roboto, sans-serif" font-size="10" letter-spacing="1">FINALIZADO</text>
      <text x="320" y="24" text-anchor="end" fill="#71717A" font-family="Roboto, sans-serif" font-size="11">5 MAY</text>
      <circle cx="24" cy="48" r="11" fill="#A21CAF"/>
      <text x="44" y="52" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="13">FC Barcelona</text>
      <text x="180" y="52" text-anchor="middle" fill="#BEF264" font-family="Roboto, sans-serif" font-size="20" font-weight="700">3 - 1</text>
      <circle cx="24" cy="76" r="11" fill="#BEF264"/>
      <text x="44" y="80" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="13">Atlético Madrid</text>
    </g>

    <g transform="translate(405 540)">
      <rect x="0" y="0" width="350" height="100" rx="10" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
      <text x="20" y="24" fill="#71717A" font-family="Roboto, sans-serif" font-size="10" letter-spacing="1">FINALIZADO</text>
      <text x="320" y="24" text-anchor="end" fill="#71717A" font-family="Roboto, sans-serif" font-size="11">6 MAY</text>
      <circle cx="24" cy="48" r="11" fill="#FFFFFF"/>
      <text x="44" y="52" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="13">Real Madrid</text>
      <text x="180" y="52" text-anchor="middle" fill="#BEF264" font-family="Roboto, sans-serif" font-size="20" font-weight="700">2 - 2</text>
      <circle cx="24" cy="76" r="11" fill="#EF4444"/>
      <text x="44" y="80" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="13">Sevilla FC</text>
    </g>

    <g transform="translate(770 540)">
      <rect x="0" y="0" width="350" height="100" rx="10" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
      <text x="20" y="24" fill="#71717A" font-family="Roboto, sans-serif" font-size="10" letter-spacing="1">FINALIZADO</text>
      <text x="320" y="24" text-anchor="end" fill="#71717A" font-family="Roboto, sans-serif" font-size="11">7 MAY</text>
      <circle cx="24" cy="48" r="11" fill="#3B82F6"/>
      <text x="44" y="52" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="13">Real Oviedo</text>
      <text x="180" y="52" text-anchor="middle" fill="#BEF264" font-family="Roboto, sans-serif" font-size="20" font-weight="700">1 - 0</text>
      <circle cx="24" cy="76" r="11" fill="#22C55E"/>
      <text x="44" y="80" fill="#D4D4D8" font-family="Roboto, sans-serif" font-size="13">Sporting Gijón</text>
    </g>
  </g>

  <text x="600" y="730" text-anchor="middle" fill="#3F3F46" font-family="monospace,monospace" font-size="10" letter-spacing="3">MOCKUP · GOALAPP CALENDARIO · POR JORNADAS</text>
</svg>

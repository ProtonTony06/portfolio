      <path d="M-5 -3 C-5 -6 -3 -8 0 -8 C3 -8 5 -6 5 -3 L5 0 L6 0 C7 0 7 1 7 2 L7 7 C7 8 7 9 6 9 L-6 9 C-7 9 -7 8 -7 7 L-7 2 C-7 1 -7 0 -6 0 L-5 0 Z" fill="#18181B"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="GoalApp - Dashboard con clasificación">
  <title>GoalApp - Dashboard</title>
  <desc>Mockup del dashboard con tabla de clasificación, próximos partidos y resultados.</desc>

  <defs>
    <linearGradient id="bgGoalDash" x1="0" y1="0" x2="0" y2="1">

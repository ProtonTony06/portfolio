<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="FormProject - Builder de formularios">
  <title>FormProject - Builder</title>
  <desc>Mockup del builder de formularios con editor de preguntas y tipos configurables.</desc>

  <defs>
    <linearGradient id="bgFPBuilder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bgFPBuilder)"/>

  <!-- Browser chrome -->
  <g>
    <rect x="20" y="20" width="1160" height="60" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="55" cy="50" r="7" fill="#EF4444"/>
    <circle cx="80" cy="50" r="7" fill="#FBBF24"/>
    <circle cx="105" cy="50" r="7" fill="#22C55E"/>
    <rect x="160" y="35" width="780" height="30" rx="15" fill="#F1F5F9"/>
    <text x="180" y="55" fill="#64748B" font-family="monospace,monospace" font-size="12">form.antoniocuevas.dev/admin/formularios/nuevo</text>
  </g>

  <g transform="translate(20 80)">
    <!-- Nav top -->
    <rect x="0" y="0" width="1160" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <g transform="translate(30 18)">
      <rect x="0" y="0" width="22" height="22" rx="5" fill="#0F172A"/>
      <path d="M6 8 L11 13 L16 8 M6 14 L11 19 L16 14" stroke="#FFFFFF" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="62" y="36" fill="#0F172A" font-family="Roboto, sans-serif" font-size="16" font-weight="700">FormProject</text>
    <text x="240" y="36" fill="#64748B" font-family="Roboto, sans-serif" font-size="13">/ Formularios / Nuevo</text>

    <!-- Body -->
    <rect x="0" y="60" width="1160" height="610" fill="url(#bgFPBuilder)"/>

    <!-- Title section -->
    <text x="40" y="110" fill="#0F172A" font-family="Roboto, sans-serif" font-size="28" font-weight="700">Nuevo formulario</text>
    <text x="40" y="134" fill="#64748B" font-family="Roboto, sans-serif" font-size="13">Define las preguntas y el slug público para compartir.</text>

    <!-- Save buttons -->
    <g transform="translate(940 100)">
      <rect x="0" y="0" width="90" height="40" rx="8" fill="none" stroke="#CBD5E1"/>
      <text x="45" y="26" text-anchor="middle" fill="#475569" font-family="Roboto, sans-serif" font-size="12" font-weight="600">Cancelar</text>
    </g>
    <g transform="translate(1040 100)">
      <rect x="0" y="0" width="80" height="40" rx="8" fill="#0F172A"/>
      <text x="40" y="26" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="12" font-weight="600">Guardar</text>
    </g>

    <!-- Meta card -->
    <g transform="translate(40 170)">
      <rect x="0" y="0" width="1120" height="100" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="24" y="32" fill="#0F172A" font-family="Roboto, sans-serif" font-size="13" font-weight="600">Título del formulario</text>
      <rect x="24" y="40" width="500" height="36" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="36" y="62" fill="#0F172A" font-family="Roboto, sans-serif" font-size="13">Encuesta de satisfacción</text>
      <text x="552" y="32" fill="#0F172A" font-family="Roboto, sans-serif" font-size="13" font-weight="600">Slug público</text>
      <rect x="552" y="40" width="280" height="36" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="564" y="62" fill="#475569" font-family="monospace,monospace" font-size="12">/f/encuesta-demo</text>
      <text x="852" y="32" fill="#0F172A" font-family="Roboto, sans-serif" font-size="13" font-weight="600">Descripción</text>
      <rect x="852" y="40" width="244" height="36" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="864" y="62" fill="#94A3B8" font-family="Roboto, sans-serif" font-size="11">Recoge feedback...</text>
    </g>

    <!-- Question 1 row -->
    <g transform="translate(40 290)">
      <rect x="0" y="0" width="1120" height="100" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="20" y="32" fill="#94A3B8" font-family="monospace,monospace" font-size="14">⋮⋮</text>
      <g transform="translate(48 18)">
        <rect x="0" y="0" width="24" height="24" rx="12" fill="#0F172A"/>
        <text x="12" y="16" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="11" font-weight="700">1</text>
      </g>
      <text x="80" y="36" fill="#0F172A" font-family="Roboto, sans-serif" font-size="14" font-weight="600">¿Cómo valorarías el servicio?</text>
      <rect x="80" y="48" width="160" height="24" rx="6" fill="#F1F5F9"/>
      <text x="92" y="65" fill="#475569" font-family="Roboto, sans-serif" font-size="11">Opción múltiple</text>
      <rect x="250" y="48" width="500" height="24" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="262" y="65" fill="#94A3B8" font-family="Roboto, sans-serif" font-size="11">Excelente, Bueno, Regular, Malo</text>
      <g transform="translate(940 28)">
        <text x="0" y="0" fill="#64748B" font-family="Roboto, sans-serif" font-size="11">Requerido</text>
        <rect x="80" y="-12" width="36" height="20" rx="10" fill="#10B981"/>
        <circle cx="106" cy="-2" r="7" fill="#FFFFFF"/>
      </g>
      <g transform="translate(940 60)">
        <rect x="0" y="0" width="60" height="22" rx="6" fill="none" stroke="#CBD5E1"/>
        <text x="30" y="15" text-anchor="middle" fill="#475569" font-family="Roboto, sans-serif" font-size="10">Editar</text>
      </g>
      <g transform="translate(1010 60)">
        <rect x="0" y="0" width="80" height="22" rx="6" fill="none" stroke="#FECACA"/>
        <text x="40" y="15" text-anchor="middle" fill="#B91C1C" font-family="Roboto, sans-serif" font-size="10">Eliminar</text>
      </g>
    </g>

    <!-- Question 2 row -->
    <g transform="translate(40 410)">
      <rect x="0" y="0" width="1120" height="100" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="20" y="32" fill="#94A3B8" font-family="monospace,monospace" font-size="14">�⋮</text>
      <g transform="translate(48 18)">
        <rect x="0" y="0" width="24" height="24" rx="12" fill="#0F172A"/>
        <text x="12" y="16" text-anchor="middle" fill="#FFFFFF" font-family="Roboto, sans-serif" font-size="11" font-weight="700">2</text>
      </g>
      <text x="80" y="36" fill="#0F172A" font-family="Roboto, sans-serif" font-size="14" font-weight="600">¿Qué echas en falta?</text>
      <rect x="80" y="48" width="160" height="24" rx="6" fill="#F1F5F9"/>
      <text x="92" y="65" fill="#475569" font-family="Roboto, sans-serif" font-size="11">Texto libre</text>
      <rect x="250" y="48" width="500" height="24" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
      <text x="262" y="65" fill="#94A3B8" font-family="Roboto, sans-serif" font-size="11">Respuesta abierta del usuario</text>
      <g transform="translate(940 28)">
        <text x="0" y="0" fill="#64748B" font-family="Roboto, sans-serif" font-size="11">Requerido</text>
        <rect x="80" y="-12" width="36" height="20" rx="10" fill="#CBD5E1"/>
        <circle cx="90" cy="-2" r="7" fill="#FFFFFF"/>
      </g>
      <g transform="translate(940 60)">
        <rect x="0" y="0" width="60" height="22" rx="6" fill="none" stroke="#CBD5E1"/>
        <text x="30" y="15" text-anchor="middle" fill="#475569" font-family="Roboto, sans-serif" font-size="10">Editar</text>
      </g>
      <g transform="translate(1010 60)">
        <rect x="0" y="0" width="80" height="22" rx="6" fill="none" stroke="#FECACA"/>
        <text x="40" y="15" text-anchor="middle" fill="#B91C1C" font-family="Roboto, sans-serif" font-size="10">Eliminar</text>
      </g>
    </g>

    <!-- Add question -->
    <g transform="translate(40 530)">
      <rect x="0" y="0" width="1120" height="60" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/>
      <g transform="translate(440 18)">
        <circle cx="14" cy="14" r="14" fill="#0F172A"/>
        <path d="M14 8 L14 20 M8 14 L20 14" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      </g>
      <text x="490" y="36" fill="#475569" font-family="Roboto, sans-serif" font-size="13" font-weight="600">Añadir pregunta</text>
    </g>

    <!-- Hint -->
    <text x="40" y="618" fill="#94A3B8" font-family="Roboto, sans-serif" font-size="11">Las preguntas nombre y correo se añadirán automáticamente al publicar.</text>
  </g>

  <text x="600" y="730" text-anchor="middle" fill="#94A3B8" font-family="monospace,monospace" font-size="10" letter-spacing="3">MOCKUP · FORMPROJECT BUILDER</text>
</svg>

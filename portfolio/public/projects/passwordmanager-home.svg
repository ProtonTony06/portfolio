<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 720" width="360" height="720" role="img" aria-label="PasswordManager - Home / Hub screen mockup">
  <title>PasswordManager Home</title>
  <desc>Mockup del hub principal con navegación rápida a todas las secciones.</desc>

  <defs>
    <linearGradient id="bgDark2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1C1E"/>
      <stop offset="1" stop-color="#0F1012"/>
    </linearGradient>
    <linearGradient id="welcomeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6F24D6"/>
      <stop offset="1" stop-color="#37007A"/>
    </linearGradient>
  </defs>

  <rect width="360" height="720" fill="url(#bgDark2)"/>

  <!-- Status bar -->
  <text x="24" y="30" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="12" font-weight="500">9:41</text>
  <g transform="translate(310 18)" fill="#E1E2E6">
    <rect x="0" y="6" width="3" height="6" rx="0.5"/>
    <rect x="5" y="4" width="3" height="8" rx="0.5"/>
    <rect x="10" y="2" width="3" height="10" rx="0.5"/>
    <rect x="15" y="0" width="3" height="12" rx="0.5"/>
  </g>

  <!-- TopAppBar -->
  <rect x="0" y="50" width="360" height="64" fill="#1A1C1E"/>
  <text x="24" y="89" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="22" font-weight="700">PasswordManager</text>
  <!-- Logout icon (top right) -->
  <g transform="translate(316 72)" fill="#BFC2C6">
    <path d="M9 1 L9 4 L4 4 L4 12 L9 12 L9 15 L1 15 L1 1 Z" transform="translate(2 0)"/>
    <path d="M8 4 L11 7 L8 10 L8 8 L5 8 L5 6 L8 6 Z" transform="translate(8 0)"/>
  </g>

  <!-- Welcome card -->
  <g transform="translate(24 138)">
    <rect x="0" y="0" width="312" height="140" rx="16" fill="url(#welcomeGrad)"/>
    <!-- Security icon -->
    <g transform="translate(136 24)" fill="#EDE2FF">
      <path d="M20 0 L0 6 L0 14 C0 22 8 30 20 32 C32 30 40 22 40 14 L40 6 Z M20 4 L36 8.5 L36 14 C36 20 30 26 20 28 C10 26 4 20 4 14 L4 8.5 Z"/>
      <path d="M14 14 L18 18 L26 10 L28 12 L18 22 L12 16 Z"/>
    </g>
    <text x="156" y="92" text-anchor="middle" fill="#EDE2FF" font-family="Roboto, sans-serif" font-size="20" font-weight="700">¡Bienvenido!</text>
    <text x="156" y="116" text-anchor="middle" fill="#D9BCFF" font-family="Roboto, sans-serif" font-size="13">Tus contraseñas están seguras</text>
    <text x="156" y="132" text-anchor="middle" fill="#D9BCFF" font-family="Roboto, sans-serif" font-size="13">y cifradas</text>
  </g>

  <!-- Section: Gestionar -->
  <text x="24" y="306" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="16" font-weight="600">Gestionar</text>

  <!-- Navigation card: Contraseñas -->
  <g transform="translate(24 320)">
    <rect x="0" y="0" width="312" height="64" rx="12" fill="#2F3133"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#EDE2FF"/>
    <g transform="translate(22 22)" fill="#37007A">
      <path d="M10 0 C7 0 5 2 5 5 L5 9 L3 9 C2 9 1 10 1 11 L1 19 C1 20 2 21 3 21 L17 21 C18 21 19 20 19 19 L19 11 C19 10 18 9 17 9 L15 9 L15 5 C15 2 13 0 10 0 Z M7 5 C7 3.5 8.5 2 10 2 C11.5 2 13 3.5 13 5 L13 9 L7 9 Z"/>
    </g>
    <text x="60" y="32" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="15" font-weight="500">Contraseñas</text>
    <text x="60" y="50" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="12">Gestiona todas tus contraseñas</text>
    <g transform="translate(286 30)" fill="#8849F5">
      <path d="M0 0 L8 8 L0 16 L0 13 L5 8 L0 3 Z" transform="translate(0 -2)"/>
    </g>
  </g>

  <!-- Navigation card: Categorías -->
  <g transform="translate(24 392)">
    <rect x="0" y="0" width="312" height="64" rx="12" fill="#2F3133"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#FFDBC9"/>
    <g transform="translate(22 22)" fill="#802E00">
      <path d="M4 0 L16 0 C17 0 18 1 18 2 L18 18 C18 19 17 20 16 20 L4 20 C3 20 2 19 2 18 L2 2 C2 1 3 0 4 0 Z M4 2 L4 9 L14 9 L14 2 Z M4 11 L18 11 L18 18 L4 18 Z"/>
    </g>
    <text x="60" y="32" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="15" font-weight="500">Categorías</text>
    <text x="60" y="50" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="12">Organiza tus cuentas por categoría</text>
    <g transform="translate(286 30)" fill="#8849F5">
      <path d="M0 0 L8 8 L0 16 L0 13 L5 8 L0 3 Z" transform="translate(0 -2)"/>
    </g>
  </g>

  <!-- Navigation card: Backup -->
  <g transform="translate(24 464)">
    <rect x="0" y="0" width="312" height="64" rx="12" fill="#2F3133"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#B9FFB4"/>
    <g transform="translate(22 22)" fill="#003D02">
      <path d="M2 4 L4 4 L4 12 L16 12 L16 4 L18 4 L18 16 L2 16 Z M10 0 L14 4 L11 4 L11 9 L9 9 L9 4 L6 4 Z"/>
    </g>
    <text x="60" y="32" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="15" font-weight="500">Backup</text>
    <text x="60" y="50" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="12">Exporta o importa tus contraseñas</text>
    <g transform="translate(286 30)" fill="#8849F5">
      <path d="M0 0 L8 8 L0 16 L0 13 L5 8 L0 3 Z" transform="translate(0 -2)"/>
    </g>
  </g>

  <!-- Section: Herramientas -->
  <text x="24" y="556" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="16" font-weight="600">Herramientas</text>

  <!-- Auditoría -->
  <g transform="translate(24 570)">
    <rect x="0" y="0" width="312" height="64" rx="12" fill="#2F3133"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#FFDAD6"/>
    <g transform="translate(22 22)" fill="#690005">
      <path d="M10 0 L20 17 L0 17 Z M9 6 L11 6 L11 11 L9 11 Z M9 13 L11 13 L11 15 L9 15 Z"/>
    </g>
    <text x="60" y="32" fill="#E1E2E6" font-family="Roboto, sans-serif" font-size="15" font-weight="500">Auditoría</text>
    <text x="60" y="50" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="12">Revisa contraseñas débiles</text>
    <g transform="translate(286 30)" fill="#8849F5">
      <path d="M0 0 L8 8 L0 16 L0 13 L5 8 L0 3 Z" transform="translate(0 -2)"/>
    </g>
  </g>

  <!-- Status footer -->
  <g transform="translate(24 658)">
    <circle cx="10" cy="6" r="8" fill="none" stroke="#5CE55A" stroke-width="1.5"/>
    <path d="M5 6 L9 10 L15 3 L17 5 L9 13 L3 7 Z" fill="#5CE55A"/>
    <text x="28" y="10" fill="#BFC2C6" font-family="Roboto, sans-serif" font-size="12">Sesión segura activa</text>
  </g>

  <text x="180" y="704" text-anchor="middle" fill="#464749" font-family="monospace" font-size="10">MOCKUP · MATERIAL 3 · DARK</text>
</svg>
